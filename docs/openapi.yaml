    post:
      tags: [conversations]
      summary: Create a relay update and re-index published updates.
      description: Admin/leadership only. On success, re-indexes all published updates into site_content under `updates://relay`.
      security: [{ portalSession: [] }, { adminKey: [] }]
      requestBody:
        required: true
