          description: Updated update.
          content:
            application/json:
              schema:
                type: object
                required: [ok, id]
                properties:
                  ok: { type: boolean }
                  id: { type: string, format: uuid }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/ServerError" }
  /admin/mumineen/registration:
    post:
      summary: Committee registration action for a family
      description: >
        Unregister a family, or mark the whole family as not attending. Requires a portal caller
        with Mumineen access (canAccessMumineen). Registration is two-state: `not_started`
        (pending) and `submitted` (registered).
        `unregister` resets the family to `not_started`, erases all submitted registration details
        (accommodation, transport, travel), clears every member's `not_attending` flag, and deletes
        the family's per-mumin Niyaz RSVP rows.
        `not_attending` sets the family's status to `submitted`, flags every active roster member
        `not_attending=true`, and reseeds the family's Niyaz RSVP to attending=false; it is rejected
        with 409 if the family is already `submitted`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [hof_its, action]
              properties:
                hof_its:
                  type: string
                  description: Head-of-family ITS identifying the family.
                action:
                  type: string
                  enum: [unregister, not_attending]
      responses:
        "200":
          description: Updated.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  hof_its:
                    type: string
                  status:
                    type: string
        "400":
          description: Missing hof_its or invalid action.
        "401":
          description: Caller not authenticated.
        "403":
          description: Caller lacks Mumineen access.
        "404":
          description: Family not found.
        "409":
          description: Family already registered (action=not_attending).
  /admin/mumineen/roster-status:
    post:
      summary: Activate or deactivate a family (and all its members) on the roster
      description: >
        Flip a whole family's `roster_active` flag on or off. Activating re-adds the family and
        every member sharing its `hof_its` to the active roster; deactivating removes them (they
        stop appearing in normal roster reads, searches, and counts). This is the UI counterpart to
        the bulk roster import's soft-deactivation, so it is gated to the same tier:
        admin/leadership plus IT (`canImportMumineen`). Looks the family up regardless of its current
        `roster_active` state (so deactivated families can be found and re-activated). Only
        `roster_active` is touched — the schema has no family head-linkage columns, and
        `mumineen.is_head` is independent of roster membership.
      security: [{ portalSession: [] }, { adminKey: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [hof_its, active]
              properties:
                hof_its:
                  type: string
                  description: Head-of-family ITS identifying the family.
                active:
                  type: boolean
                  description: Target roster membership state for the family and all its members.
      responses:
        "200":
          description: Updated. Returns the family's members with their refreshed roster_active.
          content:
            application/json:
              schema:
                type: object
                required: [ok, hof_its, active, members]
                properties:
                  ok: { type: boolean }
                  hof_its: { type: string }
                  active: { type: boolean }
                  members:
                    type: array
                    items:
                      type: object
                      properties:
                        its: { type: string }
                        full_name: { type: string, nullable: true }
                        is_head: { type: boolean }
                        roster_active: { type: boolean }
        "400":
          description: Missing/invalid hof_its or active.
        "401":
          description: Caller not authenticated.
        "403":
          description: Caller lacks roster-management access (canImportMumineen).
        "404":
          description: Family not found.
  /register:
    get:
      tags: [registration]
      summary: Load a family's registration data by ITS number.
      description: Public. Accepts any family member's ITS number. Returns locked status when already submitted/confirmed, or full roster data when pending.
      parameters:
        - in: query
          name: hof
          required: true
          schema: { type: string }
          description: ITS number of any family member.
      responses:
        "200":
          description: Pending family data or locked status.
          content:
            application/json:
              schema:
                oneOf:
                  - type: object
                    required: [locked, status]
                    properties:
                      locked: { type: boolean, enum: [true] }
                      status: { type: string, enum: [submitted, confirmed] }
                  - type: object
                    required: [family, members, departments, is_local]
                    properties:
                      family: { type: object }
                      members: { type: array, items: { type: object } }
                      departments: { type: array, items: { type: object } }
                      is_local: { type: boolean }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      tags: [registration]
      summary: Submit or edit a family registration.
      description: >
        Public. First submission sets status to submitted. Subsequent edits require a valid
        edit_token from /register/otp/verify. Accommodation and transport are required for mehman
        families EXCEPT when every member is marked not-attending — such a family isn't coming, so
        those fields are neither required nor stored (any previously entered values are cleared).
        Local families never provide accommodation/transport.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [hof_its, members]
              properties:
                hof_its: { type: string }
                submitted_by_its: { type: string, nullable: true }
                edit_token: { type: string, format: uuid, description: Required for editing an already-submitted registration. Obtained from /register/otp/verify. }
                members: { type: array, items: { type: object } }
                accommodation: { type: object }
                transport: { type: object }
      responses:
        "200":
          description: Registration saved.
          content:
            application/json:
              schema:
                type: object
                required: [ok, members_updated]
                properties:
                  ok: { type: boolean }
                  members_updated: { type: integer }
                  edited: { type: boolean }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: Registration already submitted and no valid edit_token provided, or edit_token expired.
          content:
            application/json:
              schema:
                type: object
                required: [error, locked]
                properties:
                  error: { type: string }
                  locked: { type: boolean }
        "500": { $ref: "#/components/responses/ServerError" }
  /register/otp:
    post:
      tags: [registration]
      summary: Request an OTP to edit a submitted registration.
      description: Public. Sends a 6-digit code to the head of family's email (or eldest attending member if HOF is not in the roster). Rate-limited to one request per 2 minutes per family.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [its]
              properties:
                its: { type: string, description: ITS number of any family member. }
      responses:
        "200":
          description: OTP sent.
          content:
            application/json:
              schema:
                type: object
                required: [masked_email]
                properties:
                  masked_email: { type: string, description: Partially masked recipient email for display (e.g. mu***@gmail.com). }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422":
          description: No email found for this family.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429":
          description: Rate limit exceeded. Try again in 2 minutes.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "500": { $ref: "#/components/responses/ServerError" }
  /register/otp/verify:
    post:
      tags: [registration]
      summary: Verify OTP and obtain an edit token.
      description: Public. Validates the 6-digit OTP. On success returns an edit_token (valid 30 min) plus prefilled family data for the edit form.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [its, otp]
              properties:
                its: { type: string }
                otp: { type: string, pattern: '^\d{6}$' }
      responses:
        "200":
          description: OTP verified. Edit token issued.
          content:
            application/json:
              schema:
                type: object
                required: [edit_token, family, members, departments, is_local]
                properties:
                  edit_token: { type: string, format: uuid }
                  family: { type: object }
                  members: { type: array, items: { type: object } }
                  departments: { type: array, items: { type: object } }
                  is_local: { type: boolean }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401":
          description: Invalid or expired OTP.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/ServerError" }

  /api/rsvp/meals:
    get:
      tags: [rsvp]
      summary: Get the caller's family Niyaz RSVP grid
      description: >-
        Self-scoped via x-whatsapp-from. Returns every UPCOMING Niyaz event (today-and-future in
        America/Chicago — past events are filtered out) with how many of the family are attending
        (split into adults/kids via mumineen.is_adult) vs. family size. Phone→family resolution
        checks mumin_phone_links first, then falls back to the member's own mumineen.whatsapp_e164,
        so roster-seeded numbers without a registration link still resolve. For genuinely unlinked
        phones, returns status=unregistered with any existing (future) unregistered_rsvps rows plus
        an events array (canonical date/meal/title per jaman) so the agent maps day references to
        real dates. Used by the get_family_meal_rsvps agent tool.
      responses:
        "200": { description: "Upcoming-only grid rows { event, attending, adults, kids, total, dateLabel } + familyMembers [{name, isAdult, isHead, notAttending}] (status=ok; dateLabel e.g. 'Mon, Jun 15' has the weekday pre-computed for the agent's read-back), or status=unregistered with rsvps + events (each with a weekday `label`) for unlinked phones." }
        "400": { $ref: "#/components/responses/BadRequest" }
    post:
      tags: [rsvp]
      summary: Update the caller's family Niyaz RSVP
      description: >-
        Self-scoped via x-whatsapp-from. Attendance is pre-set from arrival dates; this records
        changes (mostly "not coming on day X"). Each entry marks the family attending or not for
        specific dates (or all days), optionally narrowed to one meal; the change cascades to the
        whole family. Used by set_family_meal_rsvps.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [entries]
              properties:
                entries:
                  type: array
                  minItems: 1
                  maxItems: 60
                  items:
                    type: object
                    required: [attending]
                    properties:
                      attending: { type: boolean }
                      titles: { type: array, items: { type: string }, description: "Preferred selector — event titles copied verbatim from the grid (e.g. 'Pehli Raat'). Server resolves title (+meal) to the correct date, avoiding hijri night-shift date guessing. Pair with meal to disambiguate a title shared by a lunch and a dinner." }
                      dates: { type: array, items: { type: string, format: date }, description: "Explicit calendar dates only. For named events use titles instead." }
                      meal: { type: string, enum: [lunch, dinner] }
                      all: { type: boolean }
                adults: { type: integer, description: "Number of adults attending. For registered families, triggers partial attendance (head of family kept first); capped at the family's adult count. For unregistered callers, records head count." }
                kids: { type: integer, description: "Number of kids attending. For registered families, triggers partial attendance; capped at the family's kid count. For unregistered callers, records head count." }
                its_number: { type: string, description: "Unregistered callers only — optional ITS for family matching." }
      responses:
        "200": { description: "Updated row count + refreshed grid. When the requested counts exceeded the family size, also returns clamped {requestedAdults, requestedKids, requestedTotal, maxAdults, maxKids, maxTotal, message} so the agent tells the user the count was capped and extras must register separately. requestedTotal/maxTotal carry the single-number (head-count) case; adults/kids the split case. (Or status=unregistered for unlinked phones — upserts into unregistered_rsvps.)" }
        "400": { $ref: "#/components/responses/BadRequest" }

  /api/parking/my-passes:
    get:
      tags: [rsvp]
      summary: Get the caller's own family's parking pass(es)
      description: >-
        Strictly self-scoped via x-whatsapp-from — resolves the caller's phone to their family
        (mumin_phone_links, falling back to the member's own whatsapp_e164) and returns ONLY that
        family's allocated parking passes. No ITS or family identifier is accepted from the request,
        so a caller can never query another person's pass. Each pass carries lot_name, color, the
        per-color entry guidance (entry; plus purpose for gold=wheelchair support and
        green=khidmat-guzaar early access), general_access (southbound Route 83 / Kingery Hwy) and
        rideshare_dropoff (Wat Buddha Damma Meditation Center). status=ok with passes; status=no_passes
        when the family has none; status=unregistered when the number isn't linked (the agent then asks
        if they need a pass and escalates to Transport). The DB has no "collected" flag, so collection
        status is asked of the user, not returned. Used by the get_family_parking_passes agent tool.
      responses:
        "200": { description: "{ status: ok|no_passes|unregistered, head_name, general_access, rideshare_dropoff, passes: [{ lot_name, color, purpose, entry }] }." }
        "400": { $ref: "#/components/responses/BadRequest" }
        "500": { description: "Pass lookup failed." }

  /api/admin/niyaz/instances:
    get:
      tags: [admin]
      summary: List Niyaz events with attendance tallies
      description: >-
        Admin/leadership (portal). Returns all events ordered by date, each with
        per-event attendance tallies (yes/no by adult/kid/family, thaal count,
        unregistered adults/kids). Thaal count includes both registered and
        unregistered attendees.
      parameters:
        - name: mode
          in: query
          schema: { type: string, enum: [max, min], default: max }
          description: >-
            max = arrival-date defaults (all registered assumed attending);
            min = only whatsapp/admin-confirmed RSVPs.
      responses:
        "200": { description: "{ instances: EventTally[] }." }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [admin]
      summary: Create a Niyaz event
      description: Admin/leadership (portal). Creates a new event (day + meal + serving type).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title]
              properties:
                title: { type: string }
                event_date: { type: string, format: date }
                hijri_date: { type: string }
                meal: { type: string, enum: [lunch, dinner] }
                serving_type: { type: string, enum: [thaal, packet] }
                description: { type: string }
      responses:
        "201": { description: "{ instance: { id } }." }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/admin/niyaz/days:
    get:
      tags: [admin]
      summary: List Niyaz days (day-level RSVP config)
      description: >-
        Admin (portal). The configured Niyaz days from niyaz_event_config (prefilled 1st–10th
        Moharram), each with a representative registration instance id for that date (used to
        preview/send the RSVP broadcast). Ordered by date.
      responses:
        "200": { description: "{ days: [{ date, title, lunch_menu, dinner_menu, rsvp_end_time, has_lunch, has_dinner, template_code, instance_id }] }." }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/admin/niyaz/days/{date}:
    get:
      tags: [admin]
      summary: Day-level Niyaz config by date
      description: Admin (portal). The niyaz_event_config row for a date (null if not configured yet).
      parameters:
        - { name: date, in: path, required: true, schema: { type: string, format: date } }
      responses:
        "200": { description: "{ date, config }." }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
    put:
      tags: [admin]
      summary: Upsert day-level Niyaz config by date
      description: Admin/leadership (portal). Partial patch — only provided fields are written.
      parameters:
        - { name: date, in: path, required: true, schema: { type: string, format: date } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                rsvp_event_title: { type: string, nullable: true }
                lunch_menu: { type: string, nullable: true }
                dinner_menu: { type: string, nullable: true }
                rsvp_end_time: { type: string, nullable: true }
                has_lunch: { type: boolean }
                has_dinner: { type: boolean }
                template_code: { type: string, nullable: true }
      responses:
        "200": { description: "{ date, config }." }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/admin/niyaz/instances/{id}/config:
    get:
      tags: [admin]
      summary: Day-level Niyaz event config (by instance)
      description: >-
        Admin/leadership (portal). The day-level config (keyed by the instance's event_date) holding
        the template-facing fields the RSVP broadcast needs: rsvp_event_title, lunch/dinner menus,
        rsvp_end_time, which meals are offered, and the template to send. The per-meal
        rsvp_registration_instance rows remain the RSVP/tally source of truth.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200": { description: "{ date, config }. config is null if not configured yet." }
        "403": { $ref: "#/components/responses/Forbidden" }
    put:
      tags: [admin]
      summary: Upsert day-level Niyaz event config
      description: Admin/leadership (portal). Partial patch — only provided fields are written.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                rsvp_event_title: { type: string, nullable: true }
                lunch_menu: { type: string, nullable: true }
                dinner_menu: { type: string, nullable: true }
                rsvp_end_time: { type: string, nullable: true }
                has_lunch: { type: boolean }
                has_dinner: { type: boolean }
                template_code: { type: string, nullable: true }
      responses:
        "200": { description: "{ date, config }." }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/admin/niyaz/instances/{id}/responses:
    get:
      tags: [admin]
      summary: Recorded Niyaz RSVP responses for an event
      description: Admin/leadership (portal). Per-mumin niyaz_rsvp rows for the event (name, attending, source) plus a yes/no summary.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200": { description: Responses + summary. }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/admin/niyaz/instances/{id}/broadcast:
    get:
      tags: [admin]
      summary: Preview the audience for a Niyaz RSVP send
      description: >-
        Admin (portal). Returns the recipient count, any unresolved ITS, and a sample list
        (name / ITS / masked phone, first 100) for the chosen audience/level/filter so the composer
        can preview who will receive the broadcast.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: audience, in: query, required: true, schema: { type: string, enum: [specific_its, all_mumineen, all_hof, all_adults] } }
        - { name: level, in: query, schema: { type: string, enum: [ind, fam] } }
        - { name: only_non_responders, in: query, schema: { type: boolean } }
        - { name: require_registered, in: query, schema: { type: boolean, default: true }, description: "false targets every roster-active, not-attending=false family (drops the submitted-registration filter)." }
        - { name: its, in: query, schema: { type: string }, description: Comma/space-separated ITS for the test audience. }
      responses:
        "200": { description: "{ count, unresolved_its, sample: [{ name, its, phone_masked }] }." }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [admin]
      summary: Send a Niyaz RSVP template (quick-reply or custom Flow/quick-reply buttons)
      description: >-
        Admin/leadership (portal). Sends an approved template to the chosen audience for the event's
        date via the broadcast queue. Body variables auto-bind to person fields, family_members, or
        the day's event-config values (rsvp_event_title / lunch_menu / dinner_menu / rsvp_end_time).
        When `buttons` is supplied (ashara_relay_double_rsvp), each button's payload templates are
        resolved per recipient — {{hof_its}}, {{RegistrationInstanceId}} (the day's numeric
        niyaz_event_config.day_id), {{EligibleFamilyCount}} — replacing the legacy
        niyaz|level|scope|date quick-reply buttons.
        Phase 1: inbound Flow/button responses are captured raw by the webhook; decoding into RSVPs
        is phase 2.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [audience, level, template_code]
              properties:
                audience: { type: string, enum: [specific_its, all_mumineen, all_hof, all_adults] }
                its: { type: array, items: { type: string } }
                only_non_responders: { type: boolean }
                require_registered: { type: boolean, default: true, description: "false targets every roster-active, not-attending=false family." }
                level: { type: string, enum: [ind, fam] }
                template_code: { type: string }
                mode: { type: string, enum: [buttons, headcount], description: "buttons = quick-reply RSVP; headcount = free-text family head count (logs a prompt for the numeric reply). Ignored when `buttons` is supplied." }
                registration_message: { type: string, description: "Head-count mode: {{registration_message}} (auto-generated if omitted)." }
                example_response: { type: string, description: "Head-count mode: {{example_response}} (default 4)." }
                buttons:
                  type: array
                  description: "Custom per-recipient button payloads (Flow + quick-reply). Replaces the legacy niyaz buttons."
                  items:
                    oneOf:
                      - type: object
                        required: [type, index, flow_token]
                        properties:
                          type: { type: string, enum: [flow] }
                          index: { type: integer }
                          flow_token: { type: string, description: "Templated, e.g. rsvp:{{Person.Id}}:{{RegistrationInstanceId}}." }
                          flow_action_data: { type: object, additionalProperties: { type: string }, description: "Templated values; integer-looking values are coerced to numbers." }
                      - type: object
                        required: [type, index, payload]
                        properties:
                          type: { type: string, enum: [quick_reply] }
                          index: { type: integer }
                          payload: { type: string, description: "Templated, e.g. rsvp:{{hof_its}}:{{RegistrationInstanceId}}:not-attending." }
                variable_bindings:
                  type: object
                  description: "Explicit per-variable bindings (override the auto-bound defaults). Each body token (and optional header) binds to a static value or a per-recipient roster field."
                  properties:
                    body:
                      type: object
                      additionalProperties:
                        oneOf:
                          - { type: object, required: [kind, value], properties: { kind: { type: string, enum: [static] }, value: { type: string } } }
                          - { type: object, required: [kind, field], properties: { kind: { type: string, enum: [field] }, field: { type: string } } }
                    header:
                      oneOf:
                        - { type: object, required: [kind, value], properties: { kind: { type: string, enum: [static] }, value: { type: string } } }
                        - { type: object, required: [kind, field], properties: { kind: { type: string, enum: [field] }, field: { type: string } } }
      responses:
        "200": { description: "{ status: started, broadcastId, total, … }." }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/feedback:
    post:
      tags: [feedback]
      summary: Submit experience feedback
      description: Append-only, self-scoped via x-whatsapp-from. One call may carry several areas; each is tagged to its owning department. Used by the submit_feedback agent tool.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [entries]
              properties:
                entries:
                  type: array
                  minItems: 1
                  maxItems: 10
                  items:
                    type: object
                    required: [area]
                    properties:
                      area: { type: string, enum: [mawaid, flow, parking_transport, audio_video, accommodation, seating, general] }
                      sentiment: { type: string, enum: [positive, neutral, negative] }
                      rating: { type: integer, minimum: 1, maximum: 5 }
                      comment: { type: string, maxLength: 2000 }
      responses:
        "200": { description: Recorded count. }
        "400": { $ref: "#/components/responses/BadRequest" }

  /api/admin/templates:
    get:
      tags: [admin, templates]
      summary: Approved templates (with friendly-name + active annotations) + selectable test users
      description: >-
        Admin/leadership only (requireAdminLeadership — admin key + DB-verified role via
        x-portal-user-id). Returns the FULL catalog (active + inactive); each template carries
        friendlyName (string|null) and isActive (boolean) merged from whatsapp_template_settings.
        The console filters its dropdowns to isActive and drives the cleanup popup from the full
        list. No phone numbers returned. Spans ALL configured WhatsApp accounts: each template is
        tagged with accountLabel (string), wabaId (string|null), and phoneNumberId (string) of the
        account/WABA that owns it, and its friendlyName/isActive are scoped to that WABA.
      responses:
        "200": { description: "templates[] (each + friendlyName, isActive, accountLabel, wabaId, phoneNumberId) + selectable_users[] (id + name only)." }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/admin/templates/settings:
    put:
      tags: [admin, templates]
      summary: Set a template's friendly name and/or active flag
      description: >-
        Admin/leadership only. Upserts whatsapp_template_settings for one Meta template, scoped to a
        WABA. Inactive templates are hidden from the console's Template dropdowns. Pass waba_id to
        annotate a non-primary account's template; omit it for the primary account. An unknown
        waba_id returns 400.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [template_name]
              properties:
                template_name: { type: string }
                waba_id: { type: string, description: "WABA that owns the template; omit for the primary account." }
                friendly_name: { type: string, nullable: true, maxLength: 120 }
                is_active: { type: boolean }
      responses:
        "200": { description: "{ template_name, friendlyName, isActive }." }
        "400": { description: "Invalid body (no fields to update)." }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/admin/templates/segments:
    get:
      tags: [admin, templates]
      summary: Niyaz reach segment sizes (free vs paid split)
      description: >-
        Admin/leadership only. Sizes of the three reach segments for the console header, each split
        into in_window (messaged within the free customer-service window — answerable for free) vs
        out_window (needs a template — counts against the daily cap). The optional `hours` query
        param overrides the free-window size (any positive value; falls back to the configured
        WHATSAPP_WINDOW_HOURS, default 24); the resolved value is echoed back as window_hours so the
        console can label the split. Counts only; no PII.
      parameters:
        - { name: hours, in: query, required: false, schema: { type: number, minimum: 1 }, description: "Override the free-window size in hours (any positive value)." }
      responses:
        "200": { description: "{ segments: [{ key, label, total, in_window, out_window }], window_hours }." }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/admin/templates/preview:
    post:
      tags: [admin, templates]
      summary: Preview an audience (free/paid counts + cost)
      description: Admin/leadership only. Counts by default; with include_recipients a capped, paginated recipient sample. For audience_key=custom pass rules; for csv_upload pass csv (raw CSV text in the audience-export/failures-export format) and the response includes csv_stats (parsed/skipped/duplicates/corrupted).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [audience_key]
              properties:
                audience_key: { type: string, enum: [selected_users, chicago_committee, arrived_hof, registered_hof, all_members, segment_all_users, segment_hof, segment_hof_unresponded, custom, csv_upload] }
                selected_user_ids: { type: array, items: { type: string, format: uuid } }
                rules: { type: object, description: react-querybuilder rule tree (audience_key=custom) }
                csv: { type: string, description: Raw CSV text in the audience-export format (audience_key=csv_upload) }
                window: { type: string, enum: [all, in_window, out_window], default: all, description: "Restrict the audience to one side of the customer-service window — in_window (free) or out_window (paid, needs a template). Counts/cost reflect the filtered subset." }
                window_hours: { type: number, minimum: 1, description: "Override the free-window size in hours, any positive value (defaults to WHATSAPP_WINDOW_HOURS, 24)." }
                include_recipients: { type: boolean }
                limit: { type: integer, minimum: 1, maximum: 200 }
                offset: { type: integer, minimum: 0 }
      responses:
        "200": { description: "{ total, in_window, out_window, est_cost_usd, funnel?, csv_stats?, recipients? }." }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/admin/templates/send:
    post:
      tags: [admin, templates]
      summary: Start a manual template broadcast
      description: Admin/leadership only. Creates a broadcast, enqueues recipients, then drains inline until the queue is empty (bounded); the minute cron is a backstop. Manual — no auto-scheduling. For audience_key=custom pass rules; for csv_upload pass csv (raw CSV text in the audience-export/failures-export format); template variables are bound via variable_bindings.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [template_code, audience_key]
              properties:
                template_code: { type: string }
                template_language: { type: string }
                audience_key: { type: string, enum: [selected_users, chicago_committee, arrived_hof, registered_hof, all_members, segment_all_users, segment_hof, segment_hof_unresponded, custom, csv_upload] }
                selected_user_ids: { type: array, items: { type: string, format: uuid } }
                rules: { type: object, description: react-querybuilder rule tree (audience_key=custom) }
                csv: { type: string, description: Raw CSV text in the audience-export format (audience_key=csv_upload) }
                window: { type: string, enum: [all, in_window, out_window], default: all, description: "Restrict the audience to one side of the customer-service window — in_window (free) or out_window (paid)." }
                window_hours: { type: number, minimum: 1, description: "Override the free-window size in hours, any positive value (defaults to WHATSAPP_WINDOW_HOURS, 24)." }
                variable_bindings: { type: object, description: Per-variable static value or roster-field mapping }
      responses:
        "200": { description: "status=started + broadcastId + counts." }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/admin/templates/audience-export:
    post:
      tags: [admin, templates]
      summary: Export the full resolved audience as a CSV download
      description: Admin/leadership only. Returns every matched recipient (Name, ITS, HOF ITS, Jamaat, City, Gender, Local/Mehman, WhatsApp, free/paid Window) as a UTF-8 CSV — the uncapped form of the preview list. For audience_key=custom pass rules; for csv_upload pass csv (raw CSV text) and the export is the resolved audience — deduped by number, roster-enriched by phone, and free/paid-labelled.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [audience_key]
              properties:
                audience_key: { type: string, enum: [selected_users, chicago_committee, arrived_hof, registered_hof, all_members, segment_all_users, segment_hof, segment_hof_unresponded, custom, csv_upload] }
                selected_user_ids: { type: array, items: { type: string, format: uuid } }
                rules: { type: object, description: react-querybuilder rule tree (audience_key=custom) }
                csv: { type: string, description: Raw CSV text in the audience-export format (audience_key=csv_upload) }
                window: { type: string, enum: [all, in_window, out_window], default: all, description: "Restrict the export to one side of the customer-service window — in_window (free) or out_window (paid)." }
                window_hours: { type: number, minimum: 1, description: "Override the free-window size in hours, any positive value (defaults to WHATSAPP_WINDOW_HOURS, 24)." }
      responses:
        "200": { description: "text/csv attachment of the resolved audience." }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/admin/templates/drain:
    post:
      tags: [admin, templates]
      summary: Manually drain pending broadcast recipients ("Send pending")
      description: Admin/leadership only. Runs a bounded drain loop until the queue is empty. Triggers real sends — same gating as /send. Used by the console to unstick broadcasts when the minute cron isn't firing.
      responses:
        "200": { description: "{ ok, processed, batches }." }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "500": { description: Drain failed. }

  /api/admin/templates/broadcasts:
    get:
      tags: [admin, templates]
      summary: Broadcast send log with metrics
      description: Admin/leadership only. Optionally filter by audience_key (e.g. niyaz_rsvp for the Niyaz RSVP sends).
      parameters:
        - { name: audience_key, in: query, required: false, schema: { type: string }, description: "Filter to broadcasts with this audience_key (e.g. niyaz_rsvp)." }
      responses:
        "200": { description: "broadcasts[] (most recent first)." }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/admin/templates/broadcasts/{id}:
    get:
      tags: [admin, templates]
      summary: One broadcast + delivery-status rollup + grouped failure reasons
      description: Admin/leadership only. Aggregate status counts and a grouped failure-reason breakdown only — no phone numbers (use /failures or /recipients for per-recipient lists). The returned broadcast object carries how the audience was defined — audience_key, audience_rules, variable_bindings, and the audience toggles window_filter / window_hours / selected_user_ids (null on broadcasts created before these were recorded). Failure reasons group by Meta's captured error code/title when available, otherwise the free/paid 24h-window fallback label.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200": { description: "broadcast (incl. audience_rules/variable_bindings/window_filter/window_hours/selected_user_ids) + status_counts + failure_reasons (reason → count)." }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/admin/templates/broadcasts/{id}/recipients:
    get:
      tags: [admin, templates]
      summary: Full recipient list for a broadcast — every status (JSON or CSV)
      description: Admin/leadership only. Returns the entire audience the broadcast sent to (sent/failed/skipped/queued/delivered/read/replied), each with phone, best-effort identity (name/ITS resolved by phone), send status, window flag, sent_at, and a detail field (failure reason for failed rows, skip reason for skipped). Exposes PII to authorized staff (same level as /failures); never shown to visitors. ?format=csv returns a download.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: format, in: query, required: false, schema: { type: string, enum: [csv] } }
      responses:
        "200": { description: "{ recipients[] } (JSON) or a text/csv attachment." }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/admin/templates/broadcasts/{id}/failures:
    get:
      tags: [admin, templates]
      summary: Per-recipient failure list for a broadcast (JSON or CSV)
      description: Admin/leadership only. Returns each failed recipient with phone, best-effort identity (name/ITS resolved by phone), window flag, and failure reason. The reason is Meta's captured error code/title (e.g. "131026: Undeliverable …") when the delivery-status webhook supplied one, otherwise a free/paid 24h-window fallback label. Exposes PII to authorized staff (same level as the audience CSV export); never shown to visitors. ?format=csv returns a download.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: format, in: query, required: false, schema: { type: string, enum: [csv] } }
      responses:
        "200": { description: "{ failures[] } (JSON) or a text/csv attachment." }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/admin/whatsapp/undeliverable:
    get:
      tags: [admin, templates]
      summary: List auto-suppressed undeliverable numbers
      description: Admin/leadership only. Numbers auto-suppressed because Meta reported them as not-on-WhatsApp / can't-receive (error 131026) past the failure threshold, so they're skipped on every broadcast. Each row carries phone, best-effort identity (name/ITS by phone), fail_count, last error code, and timestamps. Exposes PII to authorized staff (same level as the failures export); never shown to visitors.
      responses:
        "200": { description: "{ numbers[] } (newest failure first)." }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    delete:
      tags: [admin, templates]
      summary: Un-flag an undeliverable number
      description: Admin/leadership only. Clears suppression for one number and resets its failure counter so it's eligible for sends again (e.g. a mistyped number that's since been corrected). It would take a fresh run of failures to re-suppress.
      parameters:
        - { name: phone, in: query, required: true, schema: { type: string }, description: "The number to un-flag (any format; normalized server-side)." }
      responses:
        "200": { description: "{ cleared: true, phone }." }
        "400": { description: "phone is required." }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { description: "Number is not on the suppression list." }

  /api/admin/prompts/{key}:
    get:
      tags: [admin]
      summary: Read a system prompt by key
      description: Admin/leadership. Returns the prompt text (DB override or code default), whether it's been customized, and the default text.
      parameters:
        - { name: key, in: path, required: true, schema: { type: string }, description: "Prompt key, e.g. agent_system, conversation_quality." }
      responses:
        "200": { description: "{ prompt_key, prompt_text, is_default, default_text, updated_by, updated_at }." }
        "403": { $ref: "#/components/responses/Forbidden" }
    put:
      tags: [admin]
      summary: Save/override a system prompt
      description: Admin/leadership. Upserts the prompt text for the given key.
      parameters:
        - { name: key, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                prompt_text: { type: string, maxLength: 10000 }
      responses:
        "200": { description: "{ prompt_key, prompt_text, updated_at }." }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/admin/prompts/rules:
    get:
      tags: [admin]
      summary: Always-on rule blocks
      description: >-
        Admin/leadership. Returns all always-on rules appended to every agent system prompt,
        each with its current text (DB override or code default), default_text, and is_default flag.
      responses:
        "200": { description: "{ rules: [{ name, label, text, default_text, is_default, updated_by, updated_at }], dynamic: string[] }." }
        "403": { $ref: "#/components/responses/Forbidden" }
    put:
      tags: [admin]
      summary: Save/override one always-on rule
      description: >-
        Admin/leadership. Upserts a rule override into system_prompts (key = rule_{name}).
        Empty text or text matching the default resets the rule (deletes the override).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, description: "Rule name, e.g. ESCALATION_POLICY." }
                text: { type: string, maxLength: 15000 }
      responses:
        "200": { description: "{ name, text, is_default }." }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/admin/department-contacts:
    get:
      tags: [admin, escalation]
      summary: List department contacts (reference rows + member users)
      description: >
        Admin-portal gated (canAccessPortal). Returns a merged list of `kind: "reference"`
        (freestanding department_contacts rows) and `kind: "member"` (whatsapp_users flagged as
        department issue contacts via department_members.contact_for_issues). Optional
        ?department_id filter.
      parameters:
        - { name: department_id, in: query, required: false, schema: { type: string, format: uuid } }
      responses:
        "200": { description: "{ contacts[] } — each item has a `kind` of reference|member." }
        "401": { $ref: "#/components/responses/Unauthorized" }
    post:
      tags: [admin, escalation]
      summary: Add a department contact (reference, existing user, or new user)
      description: >
        Admin-portal gated (canAccessPortal). `mode` selects the behavior:
        `reference` (default) inserts a freestanding department_contacts row;
        `existing_user` flags an existing department member as an issue contact (sets
        contact_for_issues=true on a membership that already exists; 400 if the user isn't a
        member — adding a user to a department and their role is managed on the Departments page);
        `new_user` creates a portal user (role committee / global_role member, reusing any
        existing user with the same phone) and a contact membership. Returns `{ contact }`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - { type: object, required: [department_id, name], properties: { mode: { type: string, enum: [reference] }, department_id: { type: string, format: uuid }, name: { type: string }, role: { type: string, nullable: true }, phone_e164: { type: string, nullable: true }, email: { type: string, format: email, nullable: true }, notes: { type: string, nullable: true }, display_order: { type: integer } } }
                - { type: object, required: [mode, department_id, user_id], properties: { mode: { type: string, enum: [existing_user] }, department_id: { type: string, format: uuid }, user_id: { type: string, format: uuid } } }
                - { type: object, required: [mode, department_id, name, phone_e164], properties: { mode: { type: string, enum: [new_user] }, department_id: { type: string, format: uuid }, name: { type: string }, phone_e164: { type: string }, email: { type: string, format: email, nullable: true }, dept_role: { type: string, enum: [member, pm, hod] }, send_welcome: { type: boolean } } }
      responses:
        "201": { description: "{ contact } — kind reference|member." }
        "400": { description: Invalid input. }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/admin/department-digest:
    get:
      tags: [admin, digest]
      summary: Stored department + all-up daily briefings
      description: Admin-portal gated (requireAdminKey). Defaults to the most recent day with summaries.
      parameters:
        - { name: date, in: query, required: false, schema: { type: string, format: date } }
      responses:
        "200": { description: "{ date, summaries[] }." }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/cron/department-digest:
    get:
      tags: [cron]
      summary: Nightly department digest (03:00 UTC (10pm Chicago, CDT))
      description: Aggregate→AI briefing→store→distribute (email + free in-window WhatsApp). Auth via CRON_SECRET bearer or admin key. Optional ?date= override.
      responses:
        "200": { description: Run result. }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/cron/broadcast-drain:
    get:
      tags: [cron]
      summary: Drain queued template-broadcast recipients (throttled batch)
      description: Runs every minute. Auth via CRON_SECRET bearer or admin key.
      responses:
        "200": { description: "{ processed, broadcastsTouched }." }
        "401": { $ref: "#/components/responses/Unauthorized" }

components:
  securitySchemes:
    whatsappPhone:
      type: apiKey
      in: header
      name: x-whatsapp-from
      description: E.164 phone number used by the WhatsApp agent and scoped user APIs.
    adminKey:
      type: apiKey
      in: header
      name: x-admin-key
      description: Server-to-server auth for agent tools and cron jobs. Never sent by browser clients.
    portalSession:
      type: apiKey
      in: cookie
      name: portal_session
      description: HMAC-SHA256-signed httpOnly session cookie set by POST /api/admin/auth. Carries { user_id, exp }. Used by all browser-facing admin routes.
    cronSecret:
      type: http
      scheme: bearer
      description: Cron bearer token derived from CRON_SECRET.
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    StatusFilter:
      name: status
      in: query
      schema: { type: string, enum: [open, in_progress, blocked, complete, all], default: all }
    PriorityFilter:
      name: priority
      in: query
      schema: { type: string, enum: [low, medium, high, all], default: all }
  responses:
    BadRequest:
      description: Invalid request.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Unauthorized:
      description: Missing or invalid authentication.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Forbidden:
      description: Caller lacks permission.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotFound:
      description: Resource not found.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    ServerError:
      description: Server error.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error: { type: string }
    TaskStatus:
      type: string
      enum: [open, in_progress, blocked, complete]
    TaskPriority:
      type: string
      enum: [low, medium, high]
    Department:
      type: object
      required: [id, name]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        description: { type: [string, "null"] }
        created_at: { type: string, format: date-time }
    DepartmentAssignmentMember:
      type: object
      required: [id, display_name, department_role]
      properties:
        id: { type: string, format: uuid }
        display_name: { type: [string, "null"] }
        department_role: { type: string, enum: [hod, pm, member] }
    User:
      type: object
      required: [id, phone_e164, role, global_role, status]
      properties:
        id: { type: string, format: uuid }
        display_name: { type: [string, "null"] }
        phone_e164: { type: string }
        email: { type: [string, "null"], format: email }
        role: { type: string, enum: [visitor, committee, admin] }
        global_role: { type: string, enum: [member, pm, hod, leadership_admin] }
        status: { type: string }
        transcript_aliases:
          type: array
          items: { type: string }
        email_digest: { type: boolean }
        department_membership_id: { type: [string, "null"], format: uuid }
        department_role: { type: [string, "null"], enum: [hod, pm, member, null] }
        contact_for_issues: { type: boolean }
    AuthSessionResponse:
      type: object
      required: [ok, token, user]
      properties:
        ok: { type: boolean }
        token: { type: string }
        user:
          type: object
          required: [id, is_support, is_manager, is_it]
          properties:
            id: { type: string, format: uuid }
            display_name: { type: [string, "null"] }
            email: { type: [string, "null"], format: email }
            role: { type: [string, "null"], enum: [visitor, committee, admin, null] }
            global_role: { type: [string, "null"], enum: [member, pm, hod, leadership_admin, null] }
            is_support: { type: boolean }
            is_manager: { type: boolean }
            is_it: { type: boolean }
    CallerContext:
      type: object
      required: [user_id, global_role, can_read_all, can_write_all, departments]
      properties:
        user_id: { type: string }
        display_name: { type: [string, "null"] }
        global_role: { type: string, enum: [member, pm, hod, leadership_admin] }
        can_read_all: { type: boolean }
        can_write_all: { type: boolean }
        departments:
          type: array
          items:
            type: object
            required: [department_id, department_name, dept_role]
            properties:
              department_id: { type: string, format: uuid }
              department_name: { type: string }
              dept_role: { type: string, enum: [hod, pm, member] }
    Task:
      type: object
      required: [id, title, status, priority, source, archived, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        description: { type: [string, "null"] }
        department_id: { type: [string, "null"], format: uuid }
        status: { $ref: "#/components/schemas/TaskStatus" }
        priority: { $ref: "#/components/schemas/TaskPriority" }
        archived: { type: boolean }
        assigned_to: { type: [string, "null"], format: uuid }
        created_by: { type: [string, "null"], format: uuid }
        source: { type: string, enum: [transcript, whatsapp_agent, manual] }
        due_date: { type: [string, "null"], format: date }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    CreateTaskRequest:
      type: object
      required: [title]
      properties:
        title: { type: string }
        department_id: { type: string, format: uuid }
        department_name: { type: string }
        description: { type: [string, "null"] }
        assigned_to: { type: [string, "null"], format: uuid }
        assigned_to_alias: { type: string }
        due_date: { type: [string, "null"], format: date }
        priority: { $ref: "#/components/schemas/TaskPriority" }
        source: { type: string, enum: [transcript, whatsapp_agent, manual] }
    UpdateTaskRequest:
      type: object
      properties:
        title: { type: string }
        description: { type: [string, "null"] }
        status: { $ref: "#/components/schemas/TaskStatus" }
        priority: { $ref: "#/components/schemas/TaskPriority" }
        department_id: { type: [string, "null"], format: uuid }
        assigned_to: { type: [string, "null"], format: uuid }
        assigned_to_alias: { type: string }
        due_date: { type: [string, "null"], format: date }
        archived: { type: boolean }
    KanbanBoard:
      type: object
      required: [open, in_progress, blocked, complete]
      properties:
        open:
          type: array
          items: { $ref: "#/components/schemas/Task" }
        in_progress:
          type: array
          items: { $ref: "#/components/schemas/Task" }
        blocked:
          type: array
          items: { $ref: "#/components/schemas/Task" }
        complete:
          type: array
          items: { $ref: "#/components/schemas/Task" }
    DepartmentSummary:
      type: object
      required: [department_name, department_id, open, in_progress, blocked, complete, total, overdue, top_blockers]
      properties:
        department_name: { type: string }
        department_id: { type: string, format: uuid }
        open: { type: integer }
        in_progress: { type: integer }
        blocked: { type: integer }
        complete: { type: integer }
        total: { type: integer }
        overdue: { type: integer }
        top_blockers:
          type: array
          items: { $ref: "#/components/schemas/Task" }
    ConversationUpload:
      type: object
      properties:
        id: { type: string, format: uuid }
        department_id: { type: string, format: uuid }
        filename: { type: [string, "null"] }
        group_name: { type: [string, "null"] }
        parsed_at: { type: [string, "null"], format: date-time }
        last_message_at: { type: [string, "null"], format: date-time }
        parsed_new_members:
          type: array
          items: { $ref: "#/components/schemas/ParsedNewMember" }
    ConversationEvent:
      type: object
      properties:
        id: { type: string, format: uuid }
        upload_id: { type: string, format: uuid }
        department_id: { type: string, format: uuid }
        event_type:
          type: string
          enum: [task_created, task_updated, task_completed, milestone_created, milestone_updated, issue_created, issue_updated, issue_resolved, decision, info]
        item_type: { type: string, enum: [task, issue, milestone] }
        task_id: { type: [string, "null"], format: uuid }
        milestone_id: { type: [string, "null"], format: uuid }
        review_action: { type: string, enum: [create, update] }
        review_kind: { type: string, enum: [task, issue, milestone] }
        target_id: { type: [string, "null"], format: uuid }
        target_title: { type: [string, "null"] }
        target_status: { type: [string, "null"] }
        review_label: { type: string }
        sender_alias: { type: [string, "null"] }
        message_text: { type: [string, "null"] }
        message_timestamp: { type: [string, "null"], format: date-time }
        ai_summary: { type: [string, "null"] }
        task_title: { type: [string, "null"] }
        milestone_title: { type: [string, "null"] }
        assigned_to_alias: { type: [string, "null"] }
        assigned_to_user_id: { type: [string, "null"], format: uuid }
        priority: { $ref: "#/components/schemas/TaskPriority" }
        confidence: { type: [number, "null"] }
        percent_complete: { type: [integer, "null"] }
        budget: { type: [number, "null"] }
        notes: { type: [string, "null"] }
        description: { type: [string, "null"] }
        suggested_status: { $ref: "#/components/schemas/TaskStatus" }
        due_date: { type: [string, "null"], format: date }
        source: { type: [string, "null"], enum: [call_transcript, whatsapp_agent, manual, transcript] }
        raw_function_event: { type: [object, "null"] }
        suggested_changes: { type: [object, "null"] }
        applied: { type: boolean }
    ParsedTranscript:
      type: object
      required: [events]
      properties:
        group_name: { type: [string, "null"] }
        last_message_at: { type: [string, "null"], format: date-time }
        departments:
          type: array
          items: { $ref: "#/components/schemas/Department" }
        existing_items:
          type: array
          items: { type: object }
        events:
          type: array
          items: { $ref: "#/components/schemas/ConversationEvent" }
        function_calls_saved: { type: integer }
        flexible_prompt: { type: string }
        transcript_type: { type: string, enum: [whatsapp, meeting] }
    ParsedNewMember:
      type: object
      required: [alias, context]
      properties:
        alias: { type: string }
        context: { type: string }
    DepartmentPromptConfig:
      type: object
      required: [fixed_prompt_locked, flexible_prompt]
      properties:
        fixed_prompt_locked: { type: boolean }
        flexible_prompt: { type: string }
        updated_at: { type: [string, "null"], format: date-time }
    ApplyTranscriptEvent:
      type: object
      required: [event_id]
      properties:
        event_id: { type: string, format: uuid }
        title: { type: string }
        description: { type: [string, "null"] }
        status: { $ref: "#/components/schemas/TaskStatus" }
        priority: { $ref: "#/components/schemas/TaskPriority" }
        due_date: { type: [string, "null"], format: date }
        budget: { type: [number, "null"] }
        percent_complete: { type: [number, "null"] }
        notes: { type: [string, "null"] }
        milestone_id: { type: [string, "null"], format: uuid }
        assigned_to_alias: { type: string }
        assigned_to_user_id: { type: [string, "null"], format: uuid }
    CreateUserRequest:
      type: object
      required: [display_name, phone_e164]
      properties:
        display_name: { type: string }
        phone_e164: { type: string }
        email: { type: [string, "null"], format: email }
        global_role: { type: string, enum: [member, pm, hod, leadership_admin] }
    UpdateUserRequest:
      type: object
      properties:
        display_name: { type: string }
        email: { type: [string, "null"], format: email }
        global_role: { type: string, enum: [member, pm, hod, leadership_admin] }
        status: { type: string }
    DepartmentMembershipRequest:
      type: object
      required: [department_id, dept_role]
      properties:
        department_id: { type: string, format: uuid }
        dept_role: { type: string, enum: [hod, pm, member] }
        is_active: { type: boolean }
        contact_for_issues: { type: boolean }
        send_welcome:
          type: boolean
          description: >-
            When true, issue a password setup link and send the new-user welcome notification
            (email + the `committee_platform_access_created` WhatsApp template). Welcomes each
            user only once: an already-welcomed user (non-null `welcomed_at`) returns
            `already_welcomed: true` and nothing is sent. When set, the response includes a
            `welcome_notification` object (see WelcomeNotification).
    WelcomeNotification:
      type: object
      description: >-
        Outcome of an onboarding welcome attempt. `already_welcomed` is true when the user had
        already been welcomed and the automatic path therefore sent nothing (the manual
        /welcome action forces a re-send and never short-circuits).
      properties:
        email: { type: string, enum: [sent, skipped, failed] }
        whatsapp: { type: string, enum: [sent, skipped, failed] }
        already_welcomed: { type: boolean }
        set_password_url: { type: string }
        errors:
          type: array
          items: { type: string }
    BulkCreateUsersRequest:
      type: object
      required: [members]
      properties:
        members:
          type: array
          items:
            type: object
            required: [display_name, phone_e164, department_id, dept_role]
            properties:
              display_name: { type: string }
              phone_e164: { type: string }
              email: { type: [string, "null"], format: email }
              department_id: { type: string, format: uuid }
              dept_role: { type: string, enum: [hod, pm, member] }
              transcript_aliases:
                type: array
                items: { type: string }
    RelayUpdate:
      type: object
      required: [id, date, title, body, category, published]
      properties:
        id: { type: string, format: uuid }
        date: { type: string, format: date }
        title: { type: string, maxLength: 200 }
        body: { type: string, maxLength: 1000 }
        category: { type: string, enum: [urgent, schedule, travel, advisory] }
        link: { type: [string, "null"], maxLength: 500, description: Optional CTA URL (http/https). }
        cta: { type: [string, "null"], maxLength: 80, description: Optional CTA label; requires link. }
        published: { type: boolean }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    RelayUpdateWriteRequest:
      type: object
      required: [user_id, date, title, body, category]
      properties:
        user_id: { type: string, format: uuid, description: Acting admin user id; server verifies admin/leadership role. }
        date: { type: string, format: date }
        title: { type: string, maxLength: 200 }
        body: { type: string, maxLength: 1000 }
        category: { type: string, enum: [urgent, schedule, travel, advisory] }
        link: { type: string, maxLength: 500, description: Optional CTA URL (http/https). }
        cta: { type: string, maxLength: 80, description: Optional CTA label; requires link. }
        published: { type: boolean, default: true }

  # --- Accommodations Module ---
  /admin/accommodations/hosts:
    get:
      tags: [accommodations]
      summary: List host rollups with capacity and demographics.
      security: [{ adminKey: [] }]
      responses:
        200:
          description: Array of host rollup rows.
          content:
            application/json:
              schema:
                type: object
                properties:
                  hosts: { type: array, items: { $ref: '#/components/schemas/AccommodationHost' } }
    post:
      tags: [accommodations]
      summary: Upload host spreadsheet (XLSX).
      security: [{ adminKey: [] }]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file: { type: string, format: binary }
      responses:
        201:
          description: Import result.
          content:
            application/json:
              schema:
                type: object
                properties:
                  rows: { type: integer }
                  hostsUpserted: { type: integer }
                  importId: { type: string, format: uuid }
    patch:
      tags: [accommodations]
      summary: Toggle include_family_friends for a host.
      security: [{ adminKey: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [hostId, include_family_friends]
              properties:
                hostId: { type: string, format: uuid }
                include_family_friends: { type: boolean }
      responses:
        200:
          description: Success.
  /admin/accommodations/guests:
    get:
      tags: [accommodations]
      summary: List awaiting-utaro guest families with demographics.
      security: [{ adminKey: [] }]
      responses:
        200:
          description: Array of guest rollup rows.
          content:
            application/json:
              schema:
                type: object
                properties:
                  guests: { type: array, items: { $ref: '#/components/schemas/AccommodationGuest' } }
  /admin/accommodations/matches:
    get:
      tags: [accommodations]
      summary: List matches or generate suggestions (?action=suggest).
      security: [{ adminKey: [] }]
      parameters:
        - name: action
          in: query
          schema: { type: string, enum: [suggest] }
      responses:
        200:
          description: Matches list or suggestions array.
    post:
      tags: [accommodations]
      summary: Create a pending match.
      security: [{ adminKey: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [guestFamilyId, hostId, guestMemberCount]
              properties:
                guestFamilyId: { type: string, format: uuid }
                hostId: { type: string, format: uuid }
                guestMemberCount: { type: integer }
                notes: { type: string }
      responses:
        201:
          description: Created match ID.
          content:
            application/json:
              schema:
                type: object
                properties:
                  matchId: { type: string, format: uuid }
    patch:
      tags: [accommodations]
      summary: Confirm, reject, or cancel a match.
      security: [{ adminKey: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [matchId, action]
              properties:
                matchId: { type: string, format: uuid }
                action: { type: string, enum: [confirm, reject, cancel] }
                confirmedBy: { type: string }
      responses:
        200:
          description: Action completed.

  # ── Issues ────────────────────────────────────────────────────
  /admin/issues:
    get:
      tags: [issues]
      summary: List issues with optional filters.
      parameters:
        - { name: status, in: query, schema: { type: string, enum: [open, in_progress, resolved, all] } }
        - { name: department_id, in: query, schema: { type: string, format: uuid } }
        - { name: priority, in: query, schema: { type: string, enum: [low, medium, high, all] } }
        - { name: search, in: query, schema: { type: string } }
      responses:
        200:
          description: List of issues with escalation counts.
    post:
      tags: [issues]
      summary: Create a new issue.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title]
              properties:
                title: { type: string }
                description: { type: string }
                priority: { type: string, enum: [low, medium, high] }
                department_id: { type: string, format: uuid }
                assigned_to: { type: string, format: uuid }
      responses:
        201:
          description: Created issue.

  /admin/issues/{issueId}:
    get:
      tags: [issues]
      summary: Issue detail with linked escalations and activity log.
      responses:
        200:
          description: Issue detail.
    put:
      tags: [issues]
      summary: Update issue fields.
      responses:
        200:
          description: Updated issue.
    delete:
      tags: [issues]
      summary: Delete an issue (cascade removes links).
      responses:
        200:
          description: Deleted.

  /admin/issues/{issueId}/link:
    post:
      tags: [issues]
      summary: Link an escalation to this issue.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone_e164]
              properties:
                phone_e164: { type: string }
      responses:
        200:
          description: Linked.
    delete:
      tags: [issues]
      summary: Unlink an escalation from this issue.
      responses:
        200:
          description: Unlinked.

  /admin/issues/{issueId}/resolve:
    post:
      tags: [issues]
      summary: Close issue — optionally notify linked conversations and resolve escalations.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                message:
                  type: string
                  maxLength: 4096
                  description: WhatsApp message sent to all linked conversations. Omit to skip.
                resolve_escalations:
                  type: boolean
                  default: true
                  description: Resolve linked escalations and switch conversations back to AI handling.
                close_issue:
                  type: boolean
                  default: true
                  description: Set issue status to resolved.
      responses:
        200:
          description: Issue closed with counts.
          content:
            application/json:
              schema:
                type: object
                properties:
                  issue:
                    type: object
                    properties:
                      id: { type: string }
                      issue_number: { type: integer }
                      status: { type: string }
                  conversations_resolved: { type: integer }
                  messages_sent: { type: integer }
                  messages_failed: { type: integer }
                  failed_phones:
                    type: array
                    items: { type: string }
                    description: Present only when messages_failed > 0.
        409:
          description: Issue is already resolved.

  /admin/issues/suggestions:
    get:
      tags: [issues]
      summary: AI grouping suggestions — analyze ungrouped escalations for clusters + matches.
      description: >-
        On-demand endpoint that fetches ungrouped escalations and open issues, sends them
        to the AI model for cluster detection, and returns suggested groupings. No caching.
      responses:
        200:
          description: Grouping suggestions.
          content:
            application/json:
              schema:
                type: object
                properties:
                  new_clusters:
                    type: array
                    description: Clusters of 2+ escalations that should be grouped into new issues.
                  existing_issue_matches:
                    type: array
                    description: Ungrouped escalations matching existing open issues.
                  meta:
                    type: object
                    properties:
                      ungrouped_count: { type: integer }
                      analyzed_at: { type: string, format: date-time }
        500:
          description: AI analysis failed.

  /admin/issues/suggestions/apply:
    post:
      tags: [issues]
      summary: Create issue from AI suggestion and bulk-link escalations.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title, session_ids]
              properties:
                title: { type: string, minLength: 1, maxLength: 500 }
                description: { type: string, maxLength: 5000 }
                priority: { type: string, enum: [low, medium, high] }
                department_id: { type: string, format: uuid }
                assigned_to: { type: string, format: uuid }
                session_ids:
                  type: array
                  items: { type: string }
                  minItems: 1
      responses:
        201:
          description: Issue created and escalations linked.
          content:
            application/json:
              schema:
                type: object
                properties:
                  issue:
                    type: object
                    properties:
                      id: { type: string }
                      issue_number: { type: integer }
                      title: { type: string }
                      status: { type: string }
                  linked_count: { type: integer }
        400:
          description: Invalid request body.

  /admin/issues/{issueId}/link-bulk:
    post:
      tags: [issues]
      summary: Bulk-link multiple escalations to an existing issue.
      parameters:
        - name: issueId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [session_ids]
              properties:
                session_ids:
                  type: array
                  items: { type: string }
                  minItems: 1
      responses:
        200:
          description: Escalations linked.
          content:
            application/json:
              schema:
                type: object
                properties:
                  linked_count: { type: integer }
                  skipped_count: { type: integer }
        404:
          description: Issue not found.

  /admin/escalations/stats:
    get:
      tags: [escalations]
      summary: KPI stats for inbox header (open, pending, breaching, avg pickup, resolved today).
      responses:
        200:
          description: SLA stats.
  /admin/escalations/{phoneE164}/suggestions:
    get:
      tags: [escalations]
      summary: AI-generated suggestions for an escalation (matching issues + resolution history).
      description: >-
        On-demand endpoint called when a support member views an escalation. Uses AI
        to match the escalation reason/category against open issues and summarize how
        similar past escalations were resolved. Results are cached in-memory for 3 minutes.
      security: [{ portalSession: [] }]
      parameters:
        - name: phoneE164
          in: path
          required: true
          schema: { type: string }
      responses:
        200:
          description: Suggestions with matching issues and resolution history.
          content:
            application/json:
              schema:
                type: object
                properties:
                  matching_issues:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: string, format: uuid }
                        issue_number: { type: integer }
                        title: { type: string }
                        status: { type: string, enum: [open, in_progress] }
                        priority: { type: string, enum: [low, medium, high] }
                        department_name: { type: string, nullable: true }
                        relevance_reason: { type: string }
                  resolution_history:
                    type: object
                    nullable: true
                    properties:
                      summary: { type: string }
                      past_count: { type: integer }
        401: { $ref: "#/components/responses/Unauthorized" }
        500: { $ref: "#/components/responses/ServerError" }

  /api/admin/parking/proximity:
    get:
      summary: Audit parking passes for proximity violations
      description: |
        Returns all families whose passes violate proximity rules (anchor lot + wrong overflow).
        Proximity rules: Gold/White anchor → overflow Red (fallback Blue); Blue anchor → overflow Blue.
        Requires canManageParking.
      tags: [Parking]
      security: [{ portalSession: [] }]
      responses:
        200:
          description: Audit result with per-family issues and planned fix targets.
          content:
            application/json:
              schema:
                type: object
                properties:
                  issues:
                    type: array
                    items:
                      type: object
                      properties:
                        family_id: { type: string, format: uuid }
                        hof_its: { type: string }
                        head_name: { type: string }
                        anchor_color: { type: string }
                        anchor_lot_name: { type: string }
                        passes_to_revoke:
                          type: array
                          items:
                            type: object
                            properties:
                              id: { type: string, format: uuid }
                              lot_name: { type: string }
                              lot_color: { type: string, nullable: true }
                        overflow_lot:
                          type: object
                          nullable: true
                          properties:
                            id: { type: string, format: uuid }
                            name: { type: string }
                            color: { type: string, nullable: true }
                        using_fallback: { type: boolean }
                        over_capacity: { type: boolean }
                  total_families: { type: integer }
                  total_to_revoke: { type: integer }
        401: { $ref: "#/components/responses/Unauthorized" }
        500: { $ref: "#/components/responses/ServerError" }
    post:
      summary: Fix all parking pass proximity violations
      description: |
        Revokes all misallocated passes and inserts replacements in the correct overflow lot.
        Processes families sequentially; tracks running lot counts to respect capacity.
        Capacity is soft — if both primary and fallback lots are full the fix proceeds with a warning.
        Requires canManageParking.
      tags: [Parking]
      security: [{ portalSession: [] }]
      responses:
        200:
          description: Fix summary.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok: { type: boolean }
                  revoked: { type: integer }
                  assigned: { type: integer }
                  skipped: { type: integer }
                  fallbacks_used: { type: integer }
        401: { $ref: "#/components/responses/Unauthorized" }
        500: { $ref: "#/components/responses/ServerError" }

  /api/admin/parking/print:
    get:
      summary: Get lot details and all passes for print layout
      description: |
        Returns the lot's metadata and every parking pass in that lot with the
        family head's name and phone number, sorted alphabetically by name.
        Used by the /admin/parking/print page to render a 2-per-page printable layout.
      tags: [Parking]
      security: [{ portalSession: [] }]
      parameters:
        - name: lot_id
          in: query
          required: true
          schema: { type: string, format: uuid }
      responses:
        200:
          description: Lot details and pass list.
          content:
            application/json:
              schema:
                type: object
                properties:
                  lot:
                    type: object
                    properties:
                      id: { type: string, format: uuid }
                      name: { type: string }
                      color: { type: string, nullable: true }
                  passes:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: string, format: uuid }
                        head_name: { type: string }
                        phone: { type: string, nullable: true }
        400: { $ref: "#/components/responses/BadRequest" }
        401: { $ref: "#/components/responses/Unauthorized" }
        404: { $ref: "#/components/responses/NotFound" }
        500: { $ref: "#/components/responses/ServerError" }
