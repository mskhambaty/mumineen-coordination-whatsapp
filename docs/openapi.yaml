  /admin/mumineen/registration:
    post:
      summary: Committee registration action for a family
      description: >
        Unregister a family, or mark the whole family as not attending. Requires a portal caller
        with Mumineen access (canAccessMumineen). Registration is two-state: `not_started`
        (pending) and `submitted` (registered).
        `unregister` resets the family to `not_started`, erases all submitted registration details
        (accommodation, transport, travel), clears every member's `not_attending` flag, and deletes
        the family's per-mumin Niyaz RSVP rows.
        `not_attending` sets the family's status to `submitted`, flags every active roster member
        `not_attending=true`, and reseeds the family's Niyaz RSVP to attending=false; it is rejected
        with 409 if the family is already `submitted`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [hof_its, action]
              properties:
                hof_its:
                  type: string
                  description: Head-of-family ITS identifying the family.
                action:
                  type: string
                  enum: [unregister, not_attending]
      responses:
        "200":
          description: Updated.
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  hof_its:
                    type: string
                  status:
                    type: string
        "400":
          description: Missing hof_its or invalid action.
        "401":
          description: Caller not authenticated.
        "403":
          description: Caller lacks Mumineen access.
        "404":
          description: Family not found.
        "409":
          description: Family already registered (action=not_attending).
  /register:
    get:
      tags: [registration]
      summary: Load a family's registration data by ITS number.
      description: Public. Accepts any family member's ITS number. Returns locked status when already submitted/confirmed, or full roster data when pending.
      parameters:
        - in: query
          name: hof
          required: true
          schema: { type: string }
          description: ITS number of any family member.
      responses:
        "200":
          description: Pending family data or locked status.
          content:
            application/json:
              schema:
                oneOf:
                  - type: object
                    required: [locked, status]
                    properties:
                      locked: { type: boolean, enum: [true] }
                      status: { type: string, enum: [submitted, confirmed] }
                  - type: object
                    required: [family, members, departments, is_local]
                    properties:
                      family: { type: object }
                      members: { type: array, items: { type: object } }
                      departments: { type: array, items: { type: object } }
                      is_local: { type: boolean }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      tags: [registration]
      summary: Submit or edit a family registration.
      description: Public. First submission sets status to submitted. Subsequent edits require a valid edit_token from /register/otp/verify.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [hof_its, members]
              properties:
                hof_its: { type: string }
                submitted_by_its: { type: string, nullable: true }
                edit_token: { type: string, format: uuid, description: Required for editing an already-submitted registration. Obtained from /register/otp/verify. }
                members: { type: array, items: { type: object } }
                accommodation: { type: object }
                transport: { type: object }
      responses:
        "200":
          description: Registration saved.
          content:
            application/json:
              schema:
                type: object
                required: [ok, members_updated]
                properties:
                  ok: { type: boolean }
                  members_updated: { type: integer }
                  edited: { type: boolean }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409":
          description: Registration already submitted and no valid edit_token provided, or edit_token expired.
          content:
            application/json:
              schema:
                type: object
                required: [error, locked]
                properties:
                  error: { type: string }
                  locked: { type: boolean }
        "500": { $ref: "#/components/responses/ServerError" }
  /register/otp:
    post:
      tags: [registration]
      summary: Request an OTP to edit a submitted registration.
      description: Public. Sends a 6-digit code to the head of family's email (or eldest attending member if HOF is not in the roster). Rate-limited to one request per 2 minutes per family.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [its]
              properties:
                its: { type: string, description: ITS number of any family member. }
      responses:
        "200":
          description: OTP sent.
          content:
            application/json:
              schema:
                type: object
                required: [masked_email]
                properties:
                  masked_email: { type: string, description: Partially masked recipient email for display (e.g. mu***@gmail.com). }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422":
          description: No email found for this family.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "429":
          description: Rate limit exceeded. Try again in 2 minutes.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "500": { $ref: "#/components/responses/ServerError" }
  /register/otp/verify:
    post:
      tags: [registration]
      summary: Verify OTP and obtain an edit token.
      description: Public. Validates the 6-digit OTP. On success returns an edit_token (valid 30 min) plus prefilled family data for the edit form.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [its, otp]
              properties:
                its: { type: string }
                otp: { type: string, pattern: '^\d{6}$' }
      responses:
        "200":
          description: OTP verified. Edit token issued.
          content:
            application/json:
              schema:
                type: object
                required: [edit_token, family, members, departments, is_local]
                properties:
                  edit_token: { type: string, format: uuid }
                  family: { type: object }
                  members: { type: array, items: { type: object } }
                  departments: { type: array, items: { type: object } }
                  is_local: { type: boolean }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401":
          description: Invalid or expired OTP.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/ServerError" }

  /api/rsvp/meals:
    get:
      tags: [rsvp]
      summary: Get the caller's family Niyaz RSVP grid
      description: Self-scoped via x-whatsapp-from. Returns every Niyaz event with how many of the family are attending vs. family size. Used by the get_family_meal_rsvps agent tool.
      responses:
        "200": { description: "Grid (or status=no_family when the number isn't on the roster)." }
        "400": { $ref: "#/components/responses/BadRequest" }
    post:
      tags: [rsvp]
      summary: Update the caller's family Niyaz RSVP
      description: >-
        Self-scoped via x-whatsapp-from. Attendance is pre-set from arrival dates; this records
        changes (mostly "not coming on day X"). Each entry marks the family attending or not for
        specific dates (or all days), optionally narrowed to one meal; the change cascades to the
        whole family. Used by set_family_meal_rsvps.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [entries]
              properties:
                entries:
                  type: array
                  minItems: 1
                  maxItems: 60
                  items:
                    type: object
                    required: [attending]
                    properties:
                      attending: { type: boolean }
                      dates: { type: array, items: { type: string, format: date } }
                      meal: { type: string, enum: [lunch, dinner] }
                      all: { type: boolean }
      responses:
        "200": { description: Updated row count + refreshed grid (or status=no_family). }
        "400": { $ref: "#/components/responses/BadRequest" }

  /api/admin/niyaz/instances/{id}/responses:
    get:
      tags: [admin]
      summary: Recorded Niyaz RSVP responses for an event
      description: Admin/leadership (portal). Per-mumin niyaz_rsvp rows for the event (name, attending, source) plus a yes/no summary.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200": { description: Responses + summary. }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/admin/niyaz/instances/{id}/broadcast:
    get:
      tags: [admin]
      summary: Preview recipient count for a Niyaz RSVP send
      description: Admin (portal). Returns the recipient count (and any unresolved ITS) for the chosen audience/level/filter.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: audience, in: query, required: true, schema: { type: string, enum: [specific_its, all_mumineen, all_hof, all_adults] } }
        - { name: level, in: query, schema: { type: string, enum: [ind, fam] } }
        - { name: only_non_responders, in: query, schema: { type: boolean } }
        - { name: its, in: query, schema: { type: string }, description: Comma/space-separated ITS for the test audience. }
      responses:
        "200": { description: "{ count, unresolved_its }." }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [admin]
      summary: Send the daily Niyaz RSVP template (quick-reply buttons)
      description: >-
        Admin/leadership (portal). Sends an approved template to the chosen audience for the event's
        date, stamping each quick-reply button with a niyaz|level|scope|date payload, via the
        broadcast queue. Taps are recorded by the WhatsApp webhook.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [audience, level, template_code]
              properties:
                audience: { type: string, enum: [specific_its, all_mumineen, all_hof, all_adults] }
                its: { type: array, items: { type: string } }
                only_non_responders: { type: boolean }
                level: { type: string, enum: [ind, fam] }
                template_code: { type: string }
                mode: { type: string, enum: [buttons, headcount], description: "buttons = quick-reply RSVP; headcount = free-text family head count (logs a prompt for the numeric reply)." }
                registration_message: { type: string, description: "Head-count mode: {{registration_message}} (auto-generated if omitted)." }
                example_response: { type: string, description: "Head-count mode: {{example_response}} (default 4)." }
      responses:
        "200": { description: "{ status: started, broadcastId, total, … }." }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /api/feedback:
    post:
      tags: [feedback]
      summary: Submit experience feedback
      description: Append-only, self-scoped via x-whatsapp-from. One call may carry several areas; each is tagged to its owning department. Used by the submit_feedback agent tool.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [entries]
              properties:
                entries:
                  type: array
                  minItems: 1
                  maxItems: 10
                  items:
                    type: object
                    required: [area]
                    properties:
                      area: { type: string, enum: [mawaid, flow, parking_transport, audio_video, accommodation, seating, general] }
                      sentiment: { type: string, enum: [positive, neutral, negative] }
                      rating: { type: integer, minimum: 1, maximum: 5 }
                      comment: { type: string, maxLength: 2000 }
      responses:
        "200": { description: Recorded count. }
        "400": { $ref: "#/components/responses/BadRequest" }

  /api/admin/templates:
    get:
      tags: [admin, templates]
      summary: Approved templates + selectable test users for the send console
      description: Admin/leadership only (requireAdminLeadership — admin key + DB-verified role via x-portal-user-id). No phone numbers returned.
      responses:
        "200": { description: "templates[] + selectable_users[] (id + name only)." }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/admin/templates/preview:
    post:
      tags: [admin, templates]
      summary: Preview an audience (free/paid counts + cost)
      description: Admin/leadership only. Returns counts only — never the phone list.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [audience_key]
              properties:
                audience_key: { type: string, enum: [selected_users, chicago_committee, arrived_hof, registered_hof, all_members] }
                selected_user_ids: { type: array, items: { type: string, format: uuid } }
      responses:
        "200": { description: "{ total, in_window, out_window, est_cost_usd }." }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/admin/templates/send:
    post:
      tags: [admin, templates]
      summary: Start a manual template broadcast
      description: Admin/leadership only. Creates a broadcast, enqueues recipients, then drains inline until the queue is empty (bounded); the minute cron is a backstop. Manual — no auto-scheduling.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [template_code, audience_key]
              properties:
                template_code: { type: string }
                template_language: { type: string }
                audience_key: { type: string, enum: [selected_users, chicago_committee, arrived_hof, registered_hof, all_members] }
                selected_user_ids: { type: array, items: { type: string, format: uuid } }
      responses:
        "200": { description: "status=started + broadcastId + counts." }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/admin/templates/drain:
    post:
      tags: [admin, templates]
      summary: Manually drain pending broadcast recipients ("Send pending")
      description: Admin/leadership only. Runs a bounded drain loop until the queue is empty. Triggers real sends — same gating as /send. Used by the console to unstick broadcasts when the minute cron isn't firing.
      responses:
        "200": { description: "{ ok, processed, batches }." }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "500": { description: Drain failed. }

  /api/admin/templates/broadcasts:
    get:
      tags: [admin, templates]
      summary: Broadcast send log with metrics
      description: Admin/leadership only.
      responses:
        "200": { description: "broadcasts[] (most recent first)." }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/admin/templates/broadcasts/{id}:
    get:
      tags: [admin, templates]
      summary: One broadcast + delivery-status rollup + grouped failure reasons
      description: Admin/leadership only. Aggregate status counts and a grouped failure-reason breakdown only — no phone numbers (use /failures for the per-recipient list). Failure reasons group by Meta's captured error code/title when available, otherwise the free/paid 24h-window fallback label.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200": { description: "broadcast + status_counts + failure_reasons (reason → count)." }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/admin/templates/broadcasts/{id}/failures:
    get:
      tags: [admin, templates]
      summary: Per-recipient failure list for a broadcast (JSON or CSV)
      description: Admin/leadership only. Returns each failed recipient with phone, best-effort identity (name/ITS resolved by phone), window flag, and failure reason. The reason is Meta's captured error code/title (e.g. "131026: Undeliverable …") when the delivery-status webhook supplied one, otherwise a free/paid 24h-window fallback label. Exposes PII to authorized staff (same level as the audience CSV export); never shown to visitors. ?format=csv returns a download.
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: format, in: query, required: false, schema: { type: string, enum: [csv] } }
      responses:
        "200": { description: "{ failures[] } (JSON) or a text/csv attachment." }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }

  /api/admin/department-digest:
    get:
      tags: [admin, digest]
      summary: Stored department + all-up daily briefings
      description: Admin-portal gated (requireAdminKey). Defaults to the most recent day with summaries.
      parameters:
        - { name: date, in: query, required: false, schema: { type: string, format: date } }
      responses:
        "200": { description: "{ date, summaries[] }." }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/cron/department-digest:
    get:
      tags: [cron]
      summary: Nightly department digest (03:00 UTC (10pm Chicago, CDT))
      description: Aggregate→AI briefing→store→distribute (email + free in-window WhatsApp). Auth via CRON_SECRET bearer or admin key. Optional ?date= override.
      responses:
        "200": { description: Run result. }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /api/cron/broadcast-drain:
    get:
      tags: [cron]
      summary: Drain queued template-broadcast recipients (throttled batch)
      description: Runs every minute. Auth via CRON_SECRET bearer or admin key.
      responses:
        "200": { description: "{ processed, broadcastsTouched }." }
        "401": { $ref: "#/components/responses/Unauthorized" }

components:
  securitySchemes:
    whatsappPhone:
      type: apiKey
      in: header
      name: x-whatsapp-from
      description: E.164 phone number used by the WhatsApp agent and scoped user APIs.
    adminKey:
      type: apiKey
      in: header
      name: x-admin-key
      description: Server-to-server auth for agent tools and cron jobs. Never sent by browser clients.
    portalSession:
      type: apiKey
      in: cookie
      name: portal_session
      description: HMAC-SHA256-signed httpOnly session cookie set by POST /api/admin/auth. Carries { user_id, exp }. Used by all browser-facing admin routes.
    cronSecret:
      type: http
      scheme: bearer
      description: Cron bearer token derived from CRON_SECRET.
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    StatusFilter:
      name: status
      in: query
      schema: { type: string, enum: [open, in_progress, blocked, complete, all], default: all }
    PriorityFilter:
      name: priority
      in: query
      schema: { type: string, enum: [low, medium, high, all], default: all }
  responses:
    BadRequest:
      description: Invalid request.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Unauthorized:
      description: Missing or invalid authentication.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Forbidden:
      description: Caller lacks permission.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotFound:
      description: Resource not found.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    ServerError:
      description: Server error.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error: { type: string }
    TaskStatus:
      type: string
      enum: [open, in_progress, blocked, complete]
    TaskPriority:
      type: string
      enum: [low, medium, high]
    Department:
      type: object
      required: [id, name]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        description: { type: [string, "null"] }
        created_at: { type: string, format: date-time }
    User:
      type: object
      required: [id, phone_e164, role, global_role, status]
      properties:
        id: { type: string, format: uuid }
        display_name: { type: [string, "null"] }
        phone_e164: { type: string }
        email: { type: [string, "null"], format: email }
        role: { type: string, enum: [visitor, committee, admin] }
        global_role: { type: string, enum: [member, pm, hod, leadership_admin] }
        status: { type: string }
        transcript_aliases:
          type: array
          items: { type: string }
        email_digest: { type: boolean }
        department_membership_id: { type: [string, "null"], format: uuid }
        department_role: { type: [string, "null"], enum: [hod, pm, member, null] }
        contact_for_issues: { type: boolean }
    AuthSessionResponse:
      type: object
      required: [ok, token, user]
      properties:
        ok: { type: boolean }
        token: { type: string }
        user:
          type: object
          required: [id, is_support, is_manager, is_it]
          properties:
            id: { type: string, format: uuid }
            display_name: { type: [string, "null"] }
            email: { type: [string, "null"], format: email }
            role: { type: [string, "null"], enum: [visitor, committee, admin, null] }
            global_role: { type: [string, "null"], enum: [member, pm, hod, leadership_admin, null] }
            is_support: { type: boolean }
            is_manager: { type: boolean }
            is_it: { type: boolean }
    CallerContext:
      type: object
      required: [user_id, global_role, can_read_all, can_write_all, departments]
      properties:
        user_id: { type: string }
        display_name: { type: [string, "null"] }
        global_role: { type: string, enum: [member, pm, hod, leadership_admin] }
        can_read_all: { type: boolean }
        can_write_all: { type: boolean }
        departments:
          type: array
          items:
            type: object
            required: [department_id, department_name, dept_role]
            properties:
              department_id: { type: string, format: uuid }
              department_name: { type: string }
              dept_role: { type: string, enum: [hod, pm, member] }
    Task:
      type: object
      required: [id, title, status, priority, source, archived, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        description: { type: [string, "null"] }
        department_id: { type: [string, "null"], format: uuid }
        status: { $ref: "#/components/schemas/TaskStatus" }
        priority: { $ref: "#/components/schemas/TaskPriority" }
        archived: { type: boolean }
        assigned_to: { type: [string, "null"], format: uuid }
        created_by: { type: [string, "null"], format: uuid }
        source: { type: string, enum: [transcript, whatsapp_agent, manual] }
        due_date: { type: [string, "null"], format: date }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    CreateTaskRequest:
      type: object
      required: [title]
      properties:
        title: { type: string }
        department_id: { type: string, format: uuid }
        department_name: { type: string }
        description: { type: [string, "null"] }
        assigned_to: { type: [string, "null"], format: uuid }
        assigned_to_alias: { type: string }
        due_date: { type: [string, "null"], format: date }
        priority: { $ref: "#/components/schemas/TaskPriority" }
        source: { type: string, enum: [transcript, whatsapp_agent, manual] }
    UpdateTaskRequest:
      type: object
      properties:
        title: { type: string }
        description: { type: [string, "null"] }
        status: { $ref: "#/components/schemas/TaskStatus" }
        priority: { $ref: "#/components/schemas/TaskPriority" }
        department_id: { type: [string, "null"], format: uuid }
        assigned_to: { type: [string, "null"], format: uuid }
        assigned_to_alias: { type: string }
        due_date: { type: [string, "null"], format: date }
        archived: { type: boolean }
    KanbanBoard:
      type: object
      required: [open, in_progress, blocked, complete]
      properties:
        open:
          type: array
          items: { $ref: "#/components/schemas/Task" }
        in_progress:
          type: array
          items: { $ref: "#/components/schemas/Task" }
        blocked:
          type: array
          items: { $ref: "#/components/schemas/Task" }
        complete:
          type: array
          items: { $ref: "#/components/schemas/Task" }
    DepartmentSummary:
      type: object
      required: [department_name, department_id, open, in_progress, blocked, complete, total, overdue, top_blockers]
      properties:
        department_name: { type: string }
        department_id: { type: string, format: uuid }
        open: { type: integer }
        in_progress: { type: integer }
        blocked: { type: integer }
        complete: { type: integer }
        total: { type: integer }
        overdue: { type: integer }
        top_blockers:
          type: array
          items: { $ref: "#/components/schemas/Task" }
    ConversationUpload:
      type: object
      properties:
        id: { type: string, format: uuid }
        department_id: { type: string, format: uuid }
        filename: { type: [string, "null"] }
        group_name: { type: [string, "null"] }
        parsed_at: { type: [string, "null"], format: date-time }
        last_message_at: { type: [string, "null"], format: date-time }
        parsed_new_members:
          type: array
          items: { $ref: "#/components/schemas/ParsedNewMember" }
    ConversationEvent:
      type: object
      properties:
        id: { type: string, format: uuid }
        upload_id: { type: string, format: uuid }
        department_id: { type: string, format: uuid }
        event_type:
          type: string
          enum: [task_created, task_updated, task_completed, milestone_created, milestone_updated, issue_created, issue_updated, issue_resolved, decision, info]
        item_type: { type: string, enum: [task, issue, milestone] }
        task_id: { type: [string, "null"], format: uuid }
        milestone_id: { type: [string, "null"], format: uuid }
        review_action: { type: string, enum: [create, update] }
        review_kind: { type: string, enum: [task, issue, milestone] }
        target_id: { type: [string, "null"], format: uuid }
        target_title: { type: [string, "null"] }
        target_status: { type: [string, "null"] }
        review_label: { type: string }
        sender_alias: { type: [string, "null"] }
        message_text: { type: [string, "null"] }
        message_timestamp: { type: [string, "null"], format: date-time }
        ai_summary: { type: [string, "null"] }
        task_title: { type: [string, "null"] }
        milestone_title: { type: [string, "null"] }
        assigned_to_alias: { type: [string, "null"] }
        assigned_to_user_id: { type: [string, "null"], format: uuid }
        priority: { $ref: "#/components/schemas/TaskPriority" }
        confidence: { type: [number, "null"] }
        percent_complete: { type: [integer, "null"] }
        budget: { type: [number, "null"] }
        notes: { type: [string, "null"] }
        description: { type: [string, "null"] }
        suggested_status: { $ref: "#/components/schemas/TaskStatus" }
        due_date: { type: [string, "null"], format: date }
        source: { type: [string, "null"], enum: [call_transcript, whatsapp_agent, manual, transcript] }
        raw_function_event: { type: [object, "null"] }
        suggested_changes: { type: [object, "null"] }
        applied: { type: boolean }
    ParsedTranscript:
      type: object
      required: [events]
      properties:
        group_name: { type: [string, "null"] }
        last_message_at: { type: [string, "null"], format: date-time }
        departments:
          type: array
          items: { $ref: "#/components/schemas/Department" }
        existing_items:
          type: array
          items: { type: object }
        events:
          type: array
          items: { $ref: "#/components/schemas/ConversationEvent" }
        function_calls_saved: { type: integer }
        flexible_prompt: { type: string }
        transcript_type: { type: string, enum: [whatsapp, meeting] }
    ParsedNewMember:
      type: object
      required: [alias, context]
      properties:
        alias: { type: string }
        context: { type: string }
    DepartmentPromptConfig:
      type: object
      required: [fixed_prompt_locked, flexible_prompt]
      properties:
        fixed_prompt_locked: { type: boolean }
        flexible_prompt: { type: string }
        updated_at: { type: [string, "null"], format: date-time }
    ApplyTranscriptEvent:
      type: object
      required: [event_id]
      properties:
        event_id: { type: string, format: uuid }
        title: { type: string }
        description: { type: [string, "null"] }
        status: { $ref: "#/components/schemas/TaskStatus" }
        priority: { $ref: "#/components/schemas/TaskPriority" }
        due_date: { type: [string, "null"], format: date }
        budget: { type: [number, "null"] }
        percent_complete: { type: [number, "null"] }
        notes: { type: [string, "null"] }
        milestone_id: { type: [string, "null"], format: uuid }
        assigned_to_alias: { type: string }
        assigned_to_user_id: { type: [string, "null"], format: uuid }
    CreateUserRequest:
      type: object
      required: [display_name, phone_e164]
      properties:
        display_name: { type: string }
        phone_e164: { type: string }
        email: { type: [string, "null"], format: email }
        global_role: { type: string, enum: [member, pm, hod, leadership_admin] }
    UpdateUserRequest:
      type: object
      properties:
        display_name: { type: string }
        email: { type: [string, "null"], format: email }
        global_role: { type: string, enum: [member, pm, hod, leadership_admin] }
        status: { type: string }
    DepartmentMembershipRequest:
      type: object
      required: [department_id, dept_role]
      properties:
        department_id: { type: string, format: uuid }
        dept_role: { type: string, enum: [hod, pm, member] }
        is_active: { type: boolean }
        contact_for_issues: { type: boolean }
        send_welcome:
          type: boolean
          description: >-
            When true, issue a password setup link and send the new-user welcome notification
            (email + the `committee_platform_access_created` WhatsApp template). Welcomes each
            user only once: an already-welcomed user (non-null `welcomed_at`) returns
            `already_welcomed: true` and nothing is sent. When set, the response includes a
            `welcome_notification` object (see WelcomeNotification).
    WelcomeNotification:
      type: object
      description: >-
        Outcome of an onboarding welcome attempt. `already_welcomed` is true when the user had
        already been welcomed and the automatic path therefore sent nothing (the manual
        /welcome action forces a re-send and never short-circuits).
      properties:
        email: { type: string, enum: [sent, skipped, failed] }
        whatsapp: { type: string, enum: [sent, skipped, failed] }
        already_welcomed: { type: boolean }
        set_password_url: { type: string }
        errors:
          type: array
          items: { type: string }
    BulkCreateUsersRequest:
      type: object
      required: [members]
      properties:
        members:
          type: array
          items:
            type: object
            required: [display_name, phone_e164, department_id, dept_role]
            properties:
              display_name: { type: string }
              phone_e164: { type: string }
              email: { type: [string, "null"], format: email }
              department_id: { type: string, format: uuid }
              dept_role: { type: string, enum: [hod, pm, member] }
              transcript_aliases:
                type: array
                items: { type: string }
    DailyDigestResult:
      type: object
      required: [ok, sent, skipped, errors]
      properties:
        ok: { type: boolean }
        sent: { type: integer }
        skipped: { type: integer }
        errors:
          type: array
          items:
            type: object
            required: [user_id, message]
            properties:
              user_id: { type: string, format: uuid }
              message: { type: string }
    RelayUpdate:
      type: object
      required: [id, date, title, body, category, published]
      properties:
        id: { type: string, format: uuid }
        date: { type: string, format: date }
        title: { type: string, maxLength: 200 }
        body: { type: string, maxLength: 1000 }
        category: { type: string, enum: [urgent, schedule, travel, advisory] }
        link: { type: [string, "null"], maxLength: 500, description: Optional CTA URL (http/https). }
        cta: { type: [string, "null"], maxLength: 80, description: Optional CTA label; requires link. }
        published: { type: boolean }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    RelayUpdateWriteRequest:
      type: object
      required: [user_id, date, title, body, category]
      properties:
        user_id: { type: string, format: uuid, description: Acting admin user id; server verifies admin/leadership role. }
        date: { type: string, format: date }
        title: { type: string, maxLength: 200 }
        body: { type: string, maxLength: 1000 }
        category: { type: string, enum: [urgent, schedule, travel, advisory] }
        link: { type: string, maxLength: 500, description: Optional CTA URL (http/https). }
        cta: { type: string, maxLength: 80, description: Optional CTA label; requires link. }
        published: { type: boolean, default: true }

  # --- Accommodations Module ---
  /admin/accommodations/hosts:
    get:
      tags: [accommodations]
      summary: List host rollups with capacity and demographics.
      security: [{ adminKey: [] }]
      responses:
        200:
          description: Array of host rollup rows.
          content:
            application/json:
              schema:
                type: object
                properties:
                  hosts: { type: array, items: { $ref: '#/components/schemas/AccommodationHost' } }
    post:
      tags: [accommodations]
      summary: Upload host spreadsheet (XLSX).
      security: [{ adminKey: [] }]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file: { type: string, format: binary }
      responses:
        201:
          description: Import result.
          content:
            application/json:
              schema:
                type: object
                properties:
                  rows: { type: integer }
                  hostsUpserted: { type: integer }
                  importId: { type: string, format: uuid }
    patch:
      tags: [accommodations]
      summary: Toggle include_family_friends for a host.
      security: [{ adminKey: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [hostId, include_family_friends]
              properties:
                hostId: { type: string, format: uuid }
                include_family_friends: { type: boolean }
      responses:
        200:
          description: Success.
  /admin/accommodations/guests:
    get:
      tags: [accommodations]
      summary: List awaiting-utaro guest families with demographics.
      security: [{ adminKey: [] }]
      responses:
        200:
          description: Array of guest rollup rows.
          content:
            application/json:
              schema:
                type: object
                properties:
                  guests: { type: array, items: { $ref: '#/components/schemas/AccommodationGuest' } }
  /admin/accommodations/matches:
    get:
      tags: [accommodations]
      summary: List matches or generate suggestions (?action=suggest).
      security: [{ adminKey: [] }]
      parameters:
        - name: action
          in: query
          schema: { type: string, enum: [suggest] }
      responses:
        200:
          description: Matches list or suggestions array.
    post:
      tags: [accommodations]
      summary: Create a pending match.
      security: [{ adminKey: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [guestFamilyId, hostId, guestMemberCount]
              properties:
                guestFamilyId: { type: string, format: uuid }
                hostId: { type: string, format: uuid }
                guestMemberCount: { type: integer }
                notes: { type: string }
      responses:
        201:
          description: Created match ID.
          content:
            application/json:
              schema:
                type: object
                properties:
                  matchId: { type: string, format: uuid }
    patch:
      tags: [accommodations]
      summary: Confirm, reject, or cancel a match.
      security: [{ adminKey: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [matchId, action]
              properties:
                matchId: { type: string, format: uuid }
                action: { type: string, enum: [confirm, reject, cancel] }
                confirmedBy: { type: string }
      responses:
        200:
          description: Action completed.

  # ── Issues ────────────────────────────────────────────────────
  /admin/issues:
    get:
      tags: [issues]
      summary: List issues with optional filters.
      parameters:
        - { name: status, in: query, schema: { type: string, enum: [open, in_progress, resolved, all] } }
        - { name: department_id, in: query, schema: { type: string, format: uuid } }
        - { name: priority, in: query, schema: { type: string, enum: [low, medium, high, all] } }
        - { name: search, in: query, schema: { type: string } }
      responses:
        200:
          description: List of issues with escalation counts.
    post:
      tags: [issues]
      summary: Create a new issue.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title]
              properties:
                title: { type: string }
                description: { type: string }
                priority: { type: string, enum: [low, medium, high] }
                department_id: { type: string, format: uuid }
                assigned_to: { type: string, format: uuid }
      responses:
        201:
          description: Created issue.

  /admin/issues/{issueId}:
    get:
      tags: [issues]
      summary: Issue detail with linked escalations and activity log.
      responses:
        200:
          description: Issue detail.
    put:
      tags: [issues]
      summary: Update issue fields.
      responses:
        200:
          description: Updated issue.
    delete:
      tags: [issues]
      summary: Delete an issue (cascade removes links).
      responses:
        200:
          description: Deleted.

  /admin/issues/{issueId}/link:
    post:
      tags: [issues]
      summary: Link an escalation to this issue.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone_e164]
              properties:
                phone_e164: { type: string }
      responses:
        200:
          description: Linked.
    delete:
      tags: [issues]
      summary: Unlink an escalation from this issue.
      responses:
        200:
          description: Unlinked.

  /admin/issues/{issueId}/resolve:
    post:
      tags: [issues]
      summary: Close issue — optionally notify linked conversations and resolve escalations.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                message:
                  type: string
                  maxLength: 4096
                  description: WhatsApp message sent to all linked conversations. Omit to skip.
                resolve_escalations:
                  type: boolean
                  default: true
                  description: Resolve linked escalations and switch conversations back to AI handling.
                close_issue:
                  type: boolean
                  default: true
                  description: Set issue status to resolved.
      responses:
        200:
          description: Issue closed with counts.
          content:
            application/json:
              schema:
                type: object
                properties:
                  issue:
                    type: object
                    properties:
                      id: { type: string }
                      issue_number: { type: integer }
                      status: { type: string }
                  conversations_resolved: { type: integer }
                  messages_sent: { type: integer }
                  messages_failed: { type: integer }
                  failed_phones:
                    type: array
                    items: { type: string }
                    description: Present only when messages_failed > 0.
        409:
          description: Issue is already resolved.

  /admin/escalations/stats:
    get:
      tags: [escalations]
      summary: KPI stats for inbox header (open, pending, breaching, avg pickup, resolved today).
      responses:
        200:
          description: SLA stats.
  /admin/escalations/{phoneE164}/suggestions:
    get:
      tags: [escalations]
      summary: AI-generated suggestions for an escalation (matching issues + resolution history).
      description: >-
        On-demand endpoint called when a support member views an escalation. Uses AI
        to match the escalation reason/category against open issues and summarize how
        similar past escalations were resolved. Results are cached in-memory for 3 minutes.
      security: [{ portalSession: [] }]
      parameters:
        - name: phoneE164
          in: path
          required: true
          schema: { type: string }
      responses:
        200:
          description: Suggestions with matching issues and resolution history.
          content:
            application/json:
              schema:
                type: object
                properties:
                  matching_issues:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: string, format: uuid }
                        issue_number: { type: integer }
                        title: { type: string }
                        status: { type: string, enum: [open, in_progress] }
                        priority: { type: string, enum: [low, medium, high] }
                        department_name: { type: string, nullable: true }
                        relevance_reason: { type: string }
                  resolution_history:
                    type: object
                    nullable: true
                    properties:
                      summary: { type: string }
                      past_count: { type: integer }
        401: { $ref: "#/components/responses/Unauthorized" }
        500: { $ref: "#/components/responses/ServerError" }
