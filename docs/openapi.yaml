openapi: 3.1.0
info:
  title: Anjuman e Saifee Coordination API
  version: 1.0.0
  description: >-
    API-first contract for the WhatsApp coordination portal, agent tools, admin dashboard,
    transcript parser, and task workflows. For which account/department role may call each
    admin route (the role × page matrix and access tiers), see docs/access-control.md — it is
    the canonical source; per-path prose here summarizes it.
servers:
  - url: /api
security:
  - whatsappPhone: []
  - portalSession: []
  - adminKey: []
tags:
  - name: auth
  - name: conversations
  - name: departments
  - name: tasks
  - name: transcripts
  - name: users
  - name: cron
  - name: email
  - name: accommodations
  - name: triage
  - name: lost-found
paths:
  /lost-found:
    post:
      tags: [lost-found]
      summary: Record a lost or found item report
      description: >-
        WhatsApp-agent intake identified by x-whatsapp-from. Reporter identity is enriched from
        registration data when available. Lost reports automatically enter the escalation
        pipeline tagged to the Lost and Found department; found reports are recorded only.
      security: [{ whatsappPhone: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [report_type, item_name]
              additionalProperties: false
              properties:
                report_type: { type: string, enum: [lost, found] }
                item_name: { type: string, minLength: 2, maxLength: 160 }
                description: { type: [string, "null"], maxLength: 2000 }
                category: { type: [string, "null"], maxLength: 120 }
                color: { type: [string, "null"], maxLength: 120 }
                brand: { type: [string, "null"], maxLength: 120 }
                location: { type: [string, "null"], maxLength: 500 }
                occurred_at: { type: [string, "null"], format: date-time }
                reporter_name: { type: [string, "null"], maxLength: 200 }
                reporter_its: { type: [string, "null"], maxLength: 40 }
      responses:
        "201": { description: Report recorded, with escalation status and help-desk guidance. }
        "400": { $ref: "#/components/responses/BadRequest" }
        "500": { $ref: "#/components/responses/ServerError" }
  /admin/lost-found:
    get:
      tags: [lost-found, admin]
      summary: List all lost and found reports
      description: >-
        Any portal member. Returns item details, escalation state, resolver info, and reporter name/phone/ITS.
      security: [{ portalSession: [] }]
      responses:
        "200": { description: "{ reports: LostFoundReport[] }." }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/ServerError" }
    post:
      tags: [lost-found, admin]
      summary: Manually add a lost or found item
      description: >-
        Any portal member can add items. Source is recorded as 'manual'.
      security: [{ portalSession: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [report_type, item_name]
              properties:
                report_type: { type: string, enum: [lost, found] }
                item_name: { type: string, minLength: 2, maxLength: 160 }
                description: { type: string, maxLength: 2000 }
                category: { type: string, maxLength: 120 }
                color: { type: string, maxLength: 120 }
                brand: { type: string, maxLength: 120 }
                location: { type: string, maxLength: 500 }
                reporter_name: { type: string, maxLength: 200 }
                reporter_its: { type: string, maxLength: 40 }
      responses:
        "201": { description: "{ report: { id, report_type, created_at } }." }
        "400": { description: "Validation error." }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/ServerError" }
  /admin/lost-found/{id}:
    put:
      tags: [lost-found, admin]
      summary: Edit a lost/found item
      description: Any portal member can edit item details.
      security: [{ portalSession: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                item_name: { type: string, minLength: 2, maxLength: 160 }
                description: { type: string, maxLength: 2000 }
                category: { type: string, maxLength: 120 }
                color: { type: string, maxLength: 120 }
                brand: { type: string, maxLength: 120 }
                location: { type: string, maxLength: 500 }
                reporter_name: { type: string, maxLength: 200 }
                reporter_its: { type: string, maxLength: 40 }
      responses:
        "200": { description: "{ ok: true }." }
        "400": { description: "Validation error." }
        "404": { description: "Report not found." }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/ServerError" }
    delete:
      tags: [lost-found, admin]
      summary: Remove a lost/found item
      description: Any portal member can delete items.
      security: [{ portalSession: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200": { description: "{ ok: true }." }
        "404": { description: "Report not found." }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/ServerError" }
  /admin/lost-found/{id}/resolve:
    patch:
      tags: [lost-found, admin]
      summary: Mark an item as resolved (found/returned)
      description: >-
        Any portal member. Records who closed it (user_id + display_name), when, and optional notes.
        Shows in the Resolved history tab.
      security: [{ portalSession: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                notes: { type: string, maxLength: 2000 }
      responses:
        "200": { description: "{ ok: true }." }
        "404": { description: "Report not found or already resolved." }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/ServerError" }
  /admin/auth:
    post:
      tags: [auth]
      summary: Log in to the admin portal.
      description: >-
        Verifies credentials and sets a `portal_session` httpOnly cookie
        (HMAC-SHA256-signed, SameSite=Lax, Secure in production, 7-day TTL).
        Returns `{ user }` in the response body — no token. The cookie is used
        by all subsequent admin API requests. 401 if credentials are invalid;
        403 if the user lacks portal access (i.e. a visitor — any non-visitor
        user may sign in, with or without a department). The email lookup is
        case-insensitive.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string }
      responses:
        "200":
          description: Authenticated user profile. Sets `portal_session` cookie.
          content:
            application/json:
              schema:
                type: object
                required: [user]
                properties:
                  user: { type: object }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/ServerError" }
  /admin/auth/logout:
    post:
      tags: [auth]
      summary: Log out of the admin portal.
      description: >-
        Clears the `portal_session` cookie. Public route — no session required.
        Clients should also clear any locally cached user state (e.g. localStorage admin_user).
      security: []
      responses:
        "200":
          description: Session cookie cleared.
          content:
            application/json:
              schema:
                type: object
                required: [ok]
                properties:
                  ok: { type: boolean }
  /auth/forgot-password:
    post:
      tags: [auth, email]
      summary: Request a password reset email.
      description: >
        Emails a reset link to any active user who can sign in to the portal —
        any non-visitor user (role "committee" or "admin"), including those not
        yet assigned to a department. Visitors (the public/mumineen) are
        excluded. The email lookup is case-insensitive. Always returns a generic
        200 response so user existence is not leaked.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email }
      responses:
        "200":
          description: Generic reset response.
          content:
            application/json:
              schema:
                type: object
                required: [ok]
                properties:
                  ok: { type: boolean }
  /auth/reset-password:
    post:
      tags: [auth]
      summary: Set a password from a reset or welcome setup link.
      description: >
        Stores the new password, clears the reset token, and returns a portal
        session so the caller can be logged in immediately. Accepts any active
        non-visitor portal user (with or without a department) — this is also the
        path the welcome "set password" link uses for new members.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, password]
              properties:
                token: { type: string }
                password: { type: string, minLength: 8 }
      responses:
        "200":
          description: Password updated and session created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthSessionResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "500": { $ref: "#/components/responses/ServerError" }
  /admin/users:
    get:
      tags: [users]
      summary: List portal users.
      security: [{ portalSession: [] }, { adminKey: [] }]
      parameters:
        - name: department_id
          in: query
          schema: { type: string, format: uuid }
          description: Optional department filter; returned users include membership metadata for that department.
      responses:
        "200":
          description: Users.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/User" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "500": { $ref: "#/components/responses/ServerError" }
    post:
      tags: [users]
      summary: Create a portal user.
      description: >-
        Any portal user (committee or admin) may create users. Only admin/leadership may
        create a user holding the Admin/Leadership account role (role=admin or
        global_role=leadership_admin) — otherwise 403.
      security: [{ portalSession: [] }, { adminKey: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateUserRequest" }
      responses:
        "201": { description: Created user. }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/ServerError" }
  /admin/users/{id}:
    get:
      tags: [users]
      summary: Get one user.
      security: [{ portalSession: [] }, { adminKey: [] }]
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "200": { description: User detail. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/ServerError" }
    put:
      tags: [users]
      summary: Update one user.
      description: >-
        Any portal user (committee or admin) may edit users. Only admin/leadership may grant,
        change, or modify the Admin/Leadership account role — a non-admin caller that tries to
        promote a user to admin/leadership, or to edit a user who already holds it, gets 403.
        DELETE on this path remains admin/leadership only.
      security: [{ portalSession: [] }, { adminKey: [] }]
      parameters: [{ $ref: "#/components/parameters/Id" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateUserRequest" }
      responses:
        "200": { description: Updated user. }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/ServerError" }
  /admin/users/{id}/departments:
    get:
      tags: [users, departments]
      summary: List a user's department memberships.
      security: [{ portalSession: [] }, { adminKey: [] }]
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "200": { description: Department memberships. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "500": { $ref: "#/components/responses/ServerError" }
    post:
      tags: [users, departments]
      summary: Add a department membership.
      security: [{ portalSession: [] }, { adminKey: [] }]
      parameters: [{ $ref: "#/components/parameters/Id" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DepartmentMembershipRequest" }
      responses:
        "201":
          description: >-
            Created membership. When the request set `send_welcome: true`, the body also includes
            a `welcome_notification` (WelcomeNotification) describing the email/WhatsApp outcome.
          content:
            application/json:
              schema:
                type: object
                properties:
                  welcome_notification: { $ref: "#/components/schemas/WelcomeNotification" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409": { description: User already in this department. }
        "500": { $ref: "#/components/responses/ServerError" }
  /admin/users/{id}/welcome:
    post:
      tags: [users]
      summary: (Re)send the onboarding welcome to an existing user.
      description: >-
        Sends the welcome email + `committee_platform_access_created` WhatsApp template with a
        fresh password-setup link, without touching department memberships. Always (re)sends — it
        forces past the once-per-user guard, so an admin can re-issue a welcome on request. A
        department is resolved from the user's memberships when not supplied; the user must belong
        to at least one department.
      security: [{ portalSession: [] }, { adminKey: [] }]
      parameters: [{ $ref: "#/components/parameters/Id" }]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                department_id: { type: string, format: uuid }
      responses:
        "200":
          description: Welcome attempted.
          content:
            application/json:
              schema:
                type: object
                properties:
                  welcome_notification: { $ref: "#/components/schemas/WelcomeNotification" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { description: User not found. }
        "500": { $ref: "#/components/responses/ServerError" }
  /admin/users/{id}/departments/{membershipId}:
    put:
      tags: [users, departments]
      summary: Update or deactivate a department membership.
      description: Supports department role, active status, and per-membership contact_for_issues notification flag.
      security: [{ portalSession: [] }, { adminKey: [] }]
      parameters:
        - { $ref: "#/components/parameters/Id" }
        - name: membershipId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200": { description: Updated membership. }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/ServerError" }
  /admin/conversations:
    get:
      tags: [conversations]
      summary: List Lead Inbox conversations with messages and tool calls.
      description: Returns recent conversations sorted by `last_message_at`; message and tool-call arrays are capped to latest activity and ordered chronologically within each conversation.
      security: [{ portalSession: [] }, { adminKey: [] }]
      parameters:
        - name: phone
          in: query
          schema: { type: string }
          description: Restrict to a single conversation by E.164 phone.
        - name: limit
          in: query
          schema: { type: integer, default: 75, maximum: 200 }
        - name: scope
          in: query
          schema: { type: string, enum: [main, niyaz], default: main }
          description: "Inbox split by the number a conversation is on (conversation_sessions.phone_number_id). main = exclude the niyaz RSVP/broadcast number; niyaz = only it."
      responses:
        "200": { description: Conversations with handling mode, messages, and tool calls. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "500": { $ref: "#/components/responses/ServerError" }
  /admin/conversations/religious-export:
    get:
      tags: [conversations]
      summary: Export religious / Lisan chats as a mobile-readable HTML transcript.
      description: >-
        Downloads a self-contained HTML chat transcript (WhatsApp-style bubbles + tool badges) of
        every conversation where the bot used a religious tool (`answer_religious_questions` or
        `get_lisan_word_meaning`), optionally bounded by a date range. Admin/leadership only.
        Contains PII (phone numbers, message bodies) — guarded by admin auth.
      security: [{ portalSession: [] }, { adminKey: [] }]
      parameters:
        - name: from
          in: query
          schema: { type: string, format: date }
          description: Inclusive start date (YYYY-MM-DD). Omit for all-time.
        - name: to
          in: query
          schema: { type: string, format: date }
          description: Inclusive end date (YYYY-MM-DD). Omit for all-time.
      responses:
        "200":
          description: An HTML file attachment (`Content-Disposition: attachment`).
          content:
            text/html: { schema: { type: string } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "500": { $ref: "#/components/responses/ServerError" }
  /admin/conversations/stream:
    get:
      tags: [conversations]
      summary: Server-Sent Events stream of inbox activity for live updates.
      description: >-
        EventSource endpoint. Emits a `changed` event when conversation activity
        changes so the Lead Inbox refetches without polling. Authenticated via
        the `portal_session` cookie (sent automatically by the browser).
      security: [{ portalSession: [] }, { adminKey: [] }]
      responses:
        "200": { description: "text/event-stream of ready/changed/ping events." }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /admin/conversations/{phoneE164}/profile:
    get:
      tags: [conversations]
      summary: Sender registration profile for the inbox User Profile panel (PII stripped).
      description: >
        Internal-only. Returns the sender's roster/registration profile with PII removed
        (age, phone, email, and ITS are never included) plus their committee department
        assignments. The full profile (with age) powers the agent's Sender Context.
      security: [{ adminKey: [] }]
      parameters:
        - name: phoneE164
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Profile (null when the sender isn't a registered roster member) and departments.
          content:
            application/json:
              schema:
                type: object
                properties:
                  profile:
                    nullable: true
                    type: object
                    description: PublicSenderProfile — registration fields with age and contacts stripped.
                  global_role: { type: string, nullable: true }
                  departments:
                    type: array
                    items:
                      type: object
                      properties:
                        name: { type: string }
                        role: { type: string }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "500": { $ref: "#/components/responses/ServerError" }
  /admin/conversations/{phoneE164}/mode:
    put:
      tags: [conversations]
      summary: Switch a conversation between AI and manual handling.
      security: [{ portalSession: [] }, { adminKey: [] }]
      parameters:
        - name: phoneE164
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [mode]
              properties:
                mode: { type: string, enum: [ai, manual] }
                user_id: { type: string, format: uuid, description: Admin making the change. }
      responses:
        "200": { description: Updated handling mode. }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/ServerError" }
  /admin/conversations/{phoneE164}/messages:
    post:
      tags: [conversations]
      summary: Send a manual WhatsApp reply for a conversation.
      description: Requires the conversation to be in manual handling mode.
      security: [{ portalSession: [] }, { adminKey: [] }]
      parameters:
        - name: phoneE164
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [body]
              properties:
                body: { type: string, maxLength: 4096 }
      responses:
        "200": { description: Reply sent; returns the WhatsApp message id. }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/ServerError" }
  /admin/conversations/{phoneE164}/escalation:
    put:
      tags: [conversations]
      summary: De-escalate or set the escalation status of a conversation.
      description: Used by the Lead Inbox De-escalate button.
      security: [{ portalSession: [] }, { adminKey: [] }]
      parameters:
        - name: phoneE164
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { type: string, enum: [resolved, pending, none] }
      responses:
        "200": { description: Updated escalation status. }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/ServerError" }
  /escalations:
    post:
      tags: [conversations]
      summary: Escalate the caller's conversation to the human support team.
      description: >-
        Called by the agent's move_to_escalation tool. Identified by the
        x-whatsapp-from header. Non-emergency escalations are declined until a
        minimum number of inbound messages exist (deterministic last-resort gate).
        Emergencies and the `religious_followup` category bypass that gate
        (a deen/Waaz question the reflections can't answer is often the first
        message); the agent then replies with a fixed Waaz-scoped acknowledgment.
        Before creating a new issue, an AI + keyword dedup check runs against
        open issues. If a match is found the escalation is linked to the existing
        issue (response includes `deduplicated: true`); otherwise a new issue +
        workspace task is created.
      security: [{ whatsappPhone: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason, priority, category]
              properties:
                reason: { type: string }
                title: { type: string, description: "AI-generated issue title" }
                description: { type: string, description: "AI-generated issue description" }
                priority: { type: string, enum: [normal, urgent] }
                category:
                  type: string
                  enum: [emergency, accommodation, transport, registration, schedule, facilities, complaint, religious_followup, other]
                department: { type: string, description: "Department name to assign the issue to" }
                source: { type: string, enum: [ai, rule, manual] }
      responses:
        "200":
          description: "Escalated (with new or deduplicated issue), or declined by the last-resort guardrail."
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, enum: [escalated, declined] }
                  priority: { type: string }
                  category: { type: string }
                  issue_id: { type: string, nullable: true }
                  deduplicated: { type: boolean, description: "True if linked to an existing issue instead of creating a new one." }
                  message: { type: string }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/ServerError" }
  /issues:
    post:
      tags: [tasks]
      summary: Log an external issue reported by a visitor (create_issue tool).
      description: >-
        Creates an `item_type='issue'`, `origin='external'` task linked to the
        reporting guest. When a department is supplied, active department members
        marked `contact_for_issues` receive assignment email and WhatsApp template
        notifications. Identified by the x-whatsapp-from header.
      security: [{ whatsappPhone: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title]
              properties:
                title: { type: string }
                description: { type: string }
                priority: { type: string, enum: [low, medium, high] }
                department: { type: string }
      responses:
        "201": { description: Created issue. }
        "400": { $ref: "#/components/responses/BadRequest" }
        "500": { $ref: "#/components/responses/ServerError" }
