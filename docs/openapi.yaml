openapi: 3.1.0
info:
  title: Anjuman e Saifee Coordination API
  version: 1.0.0
  description: API-first contract for the WhatsApp coordination portal, agent tools, admin dashboard, transcript parser, and task workflows.
servers:
  - url: /api
security:
  - whatsappPhone: []
  - portalSession: []
  - adminKey: []
tags:
  - name: auth
  - name: conversations
  - name: departments
  - name: tasks
  - name: transcripts
  - name: users
  - name: cron
  - name: email
paths:
  /admin/auth:
    post:
      tags: [auth]
      summary: Log in to the admin portal.
      description: >-
        Verifies credentials and sets a `portal_session` httpOnly cookie
        (HMAC-SHA256-signed, SameSite=Lax, Secure in production, 7-day TTL).
        Returns `{ user }` in the response body — no token. The cookie is used
        by all subsequent admin API requests. 401 if credentials are invalid;
        403 if the user lacks portal access.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string }
      responses:
        "200":
          description: Authenticated user profile. Sets `portal_session` cookie.
          content:
            application/json:
              schema:
                type: object
                required: [user]
                properties:
                  user: { type: object }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/ServerError" }
  /admin/auth/logout:
    post:
      tags: [auth]
      summary: Log out of the admin portal.
      description: >-
        Clears the `portal_session` cookie. Public route — no session required.
        Clients should also clear any locally cached user state (e.g. localStorage admin_user).
      security: []
      responses:
        "200":
          description: Session cookie cleared.
          content:
            application/json:
              schema:
                type: object
                required: [ok]
                properties:
                  ok: { type: boolean }
  /auth/forgot-password:
    post:
      tags: [auth, email]
      summary: Request a password reset email.
      description: Always returns a generic 200 response so user existence is not leaked.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email }
      responses:
        "200":
          description: Generic reset response.
          content:
            application/json:
              schema:
                type: object
                required: [ok]
                properties:
                  ok: { type: boolean }
  /auth/reset-password:
    post:
      tags: [auth]
      summary: Set a password from a reset or welcome setup link.
      description: Stores the new password, clears the reset token, and returns a portal session so the caller can be logged in immediately.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, password]
              properties:
                token: { type: string }
                password: { type: string, minLength: 8 }
      responses:
        "200":
          description: Password updated and session created.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthSessionResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "500": { $ref: "#/components/responses/ServerError" }
  /admin/users:
    get:
      tags: [users]
      summary: List portal users.
      security: [{ portalSession: [] }, { adminKey: [] }]
      parameters:
        - name: department_id
          in: query
          schema: { type: string, format: uuid }
          description: Optional department filter; returned users include membership metadata for that department.
      responses:
        "200":
          description: Users.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/User" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "500": { $ref: "#/components/responses/ServerError" }
    post:
      tags: [users]
      summary: Create a portal user.
      security: [{ portalSession: [] }, { adminKey: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateUserRequest" }
      responses:
        "201": { description: Created user. }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "500": { $ref: "#/components/responses/ServerError" }
  /admin/users/{id}:
    get:
      tags: [users]
      summary: Get one user.
      security: [{ portalSession: [] }, { adminKey: [] }]
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "200": { description: User detail. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/ServerError" }
    put:
      tags: [users]
      summary: Update one user.
      security: [{ portalSession: [] }, { adminKey: [] }]
      parameters: [{ $ref: "#/components/parameters/Id" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateUserRequest" }
      responses:
        "200": { description: Updated user. }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/ServerError" }
  /admin/users/{id}/departments:
    get:
      tags: [users, departments]
      summary: List a user's department memberships.
      security: [{ portalSession: [] }, { adminKey: [] }]
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "200": { description: Department memberships. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "500": { $ref: "#/components/responses/ServerError" }
    post:
      tags: [users, departments]
      summary: Add a department membership.
      security: [{ portalSession: [] }, { adminKey: [] }]
      parameters: [{ $ref: "#/components/parameters/Id" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DepartmentMembershipRequest" }
      responses:
        "201":
          description: >-
            Created membership. When the request set `send_welcome: true`, the body also includes
            a `welcome_notification` (WelcomeNotification) describing the email/WhatsApp outcome.
          content:
            application/json:
              schema:
                type: object
                properties:
                  welcome_notification: { $ref: "#/components/schemas/WelcomeNotification" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409": { description: User already in this department. }
        "500": { $ref: "#/components/responses/ServerError" }
  /admin/users/{id}/welcome:
    post:
      tags: [users]
      summary: (Re)send the onboarding welcome to an existing user.
      description: >-
        Sends the welcome email + `committee_platform_access_created` WhatsApp template with a
        fresh password-setup link, without touching department memberships. Always (re)sends — it
        forces past the once-per-user guard, so an admin can re-issue a welcome on request. A
        department is resolved from the user's memberships when not supplied; the user must belong
        to at least one department.
      security: [{ portalSession: [] }, { adminKey: [] }]
      parameters: [{ $ref: "#/components/parameters/Id" }]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                department_id: { type: string, format: uuid }
      responses:
        "200":
          description: Welcome attempted.
          content:
            application/json:
              schema:
                type: object
                properties:
                  welcome_notification: { $ref: "#/components/schemas/WelcomeNotification" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { description: User not found. }
        "500": { $ref: "#/components/responses/ServerError" }
  /admin/users/{id}/departments/{membershipId}:
    put:
      tags: [users, departments]
      summary: Update or deactivate a department membership.
      description: Supports department role, active status, and per-membership contact_for_issues notification flag.
      security: [{ portalSession: [] }, { adminKey: [] }]
      parameters:
        - { $ref: "#/components/parameters/Id" }
        - name: membershipId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200": { description: Updated membership. }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/ServerError" }
  /admin/conversations:
    get:
      tags: [conversations]
      summary: List Lead Inbox conversations with messages and tool calls.
      description: Returns recent conversations sorted by `last_message_at`; message and tool-call arrays are capped to latest activity and ordered chronologically within each conversation.
      security: [{ portalSession: [] }, { adminKey: [] }]
      parameters:
        - name: phone
          in: query
          schema: { type: string }
          description: Restrict to a single conversation by E.164 phone.
        - name: limit
          in: query
          schema: { type: integer, default: 75, maximum: 200 }
      responses:
        "200": { description: Conversations with handling mode, messages, and tool calls. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "500": { $ref: "#/components/responses/ServerError" }
  /admin/conversations/stream:
    get:
      tags: [conversations]
      summary: Server-Sent Events stream of inbox activity for live updates.
      description: >-
        EventSource endpoint. Emits a `changed` event when conversation activity
        changes so the Lead Inbox refetches without polling. Authenticated via
        the `portal_session` cookie (sent automatically by the browser).
      security: [{ portalSession: [] }, { adminKey: [] }]
      responses:
        "200": { description: "text/event-stream of ready/changed/ping events." }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /admin/conversations/{phoneE164}/mode:
    put:
      tags: [conversations]
      summary: Switch a conversation between AI and manual handling.
      security: [{ portalSession: [] }, { adminKey: [] }]
      parameters:
        - name: phoneE164
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [mode]
              properties:
                mode: { type: string, enum: [ai, manual] }
                user_id: { type: string, format: uuid, description: Admin making the change. }
      responses:
        "200": { description: Updated handling mode. }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/ServerError" }
  /admin/conversations/{phoneE164}/messages:
    post:
      tags: [conversations]
      summary: Send a manual WhatsApp reply for a conversation.
      description: Requires the conversation to be in manual handling mode.
      security: [{ portalSession: [] }, { adminKey: [] }]
      parameters:
        - name: phoneE164
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [body]
              properties:
                body: { type: string, maxLength: 4096 }
      responses:
        "200": { description: Reply sent; returns the WhatsApp message id. }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/ServerError" }
  /admin/conversations/{phoneE164}/escalation:
    put:
      tags: [conversations]
      summary: De-escalate or set the escalation status of a conversation.
      description: Used by the Lead Inbox De-escalate button.
      security: [{ portalSession: [] }, { adminKey: [] }]
      parameters:
        - name: phoneE164
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { type: string, enum: [resolved, pending, none] }
      responses:
        "200": { description: Updated escalation status. }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/ServerError" }
  /escalations:
    post:
      tags: [conversations]
      summary: Escalate the caller's conversation to the human support team.
      description: >-
        Called by the agent's move_to_escalation tool. Identified by the
        x-whatsapp-from header. Non-emergency escalations are declined until a
        minimum number of inbound messages exist (deterministic last-resort gate).
      security: [{ whatsappPhone: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason, priority, category]
              properties:
                reason: { type: string }
                priority: { type: string, enum: [normal, urgent] }
                category:
                  type: string
                  enum: [emergency, accommodation, transport, registration, schedule, facilities, complaint, other]
                source: { type: string, enum: [ai, rule, manual] }
      responses:
        "200": { description: "Escalated, or declined by the last-resort guardrail." }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/ServerError" }
  /issues:
    post:
      tags: [tasks]
      summary: Log an external issue reported by a visitor (create_issue tool).
      description: >-
        Creates an `item_type='issue'`, `origin='external'` task linked to the
        reporting guest. When a department is supplied, active department members
        marked `contact_for_issues` receive assignment email and WhatsApp template
        notifications. Identified by the x-whatsapp-from header.
      security: [{ whatsappPhone: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title]
              properties:
                title: { type: string }
                description: { type: string }
                priority: { type: string, enum: [low, medium, high] }
                department: { type: string }
      responses:
        "201": { description: Created issue. }
        "400": { $ref: "#/components/responses/BadRequest" }
        "500": { $ref: "#/components/responses/ServerError" }
  /admin/escalation-support:
    get:
      tags: [conversations, users]
      summary: List escalation/support team members with on-call hours.
      security: [{ portalSession: [] }, { adminKey: [] }]
      responses:
        "200": { description: Support members with user info and on-call hours. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "500": { $ref: "#/components/responses/ServerError" }
    post:
      tags: [conversations, users]
      summary: Add an existing user to the support team.
      security: [{ portalSession: [] }, { adminKey: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [user_id]
              properties:
                user_id: { type: string, format: uuid }
      responses:
        "201": { description: Created support member. }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409": { description: User is already on the support team. }
        "500": { $ref: "#/components/responses/ServerError" }
  /admin/escalation-support/{id}:
    delete:
      tags: [conversations, users]
      summary: Remove a support team member (cascades their on-call hours).
      security: [{ portalSession: [] }, { adminKey: [] }]
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "200": { description: Removed. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "500": { $ref: "#/components/responses/ServerError" }
    put:
      tags: [conversations, users]
      summary: Replace a member's weekly on-call hours (America/Chicago).
      security: [{ portalSession: [] }, { adminKey: [] }]
      parameters: [{ $ref: "#/components/parameters/Id" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [hours]
              properties:
                hours:
                  type: array
                  items:
                    type: object
                    required: [day_of_week, start_time, end_time]
                    properties:
                      day_of_week: { type: integer, minimum: 0, maximum: 6 }
                      start_time: { type: string, example: "09:00" }
                      end_time: { type: string, example: "17:00" }
      responses:
        "200": { description: On-call hours replaced. }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/ServerError" }
  /knowledge:
    get:
      tags: [conversations]
      summary: List uploaded FAQ/guide documents.
      security: [{ portalSession: [] }, { adminKey: [] }]
      parameters:
        - name: store
          in: query
          required: false
          schema: { type: string, enum: [logistics, religious] }
          description: Filter by destination store. Omit for all.
      responses:
        "200": { description: Documents with status and chunk counts. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "500": { $ref: "#/components/responses/ServerError" }
    post:
      tags: [conversations]
      summary: Upload a CSV/Excel/Word/PDF document and index it.
      description: Admin/leadership or department PM/HOD. Extracted text is chunked, embedded, and stored for the agent — into site_content (store=logistics, default) or religious_content (store=religious, not department-scoped).
      security: [{ portalSession: [] }, { adminKey: [] }]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
                title: { type: string }
                department_id: { type: string, format: uuid }
                store: { type: string, enum: [logistics, religious], default: logistics }
      responses:
        "201": { description: Indexed document with chunk count. }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { description: No extractable text (e.g. scanned PDF). }
        "500": { $ref: "#/components/responses/ServerError" }
  /knowledge/{id}:
    delete:
      tags: [conversations]
      summary: Delete a document and remove its vectors from its store.
      security: [{ portalSession: [] }, { adminKey: [] }]
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "200": { description: Deleted. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "500": { $ref: "#/components/responses/ServerError" }
  /admin/lisan-words:
    get:
      tags: [conversations]
      summary: Count of Lisan ud Dawat words currently loaded for exact lookup.
      security: [{ portalSession: [] }, { adminKey: [] }]
      responses:
        "200": { description: "{ count }." }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "500": { $ref: "#/components/responses/ServerError" }
    post:
      tags: [conversations]
      summary: Upload the dictionary CSV (full replace) into the lisan_words exact-lookup table.
      description: "Columns by header: transliteration/word, lisan, meaning, example. Powers get_lisan_word_meaning."
      security: [{ portalSession: [] }, { adminKey: [] }]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
      responses:
        "201": { description: Imported with word count. }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { description: CSV missing data rows or required columns. }
        "500": { $ref: "#/components/responses/ServerError" }
  /admin/religious-topics:
    get:
      tags: [conversations]
      summary: List religious content topic blocks (Vaaz Talaqi, Iqtibasaat, Lisan word meanings).
      security: [{ portalSession: [] }, { adminKey: [] }]
      responses:
        "200": { description: Topics with content + entry/chunk counts. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "500": { $ref: "#/components/responses/ServerError" }
    post:
      tags: [conversations]
      summary: Create a new (empty) religious topic block.
      security: [{ portalSession: [] }, { adminKey: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title]
              properties:
                title: { type: string }
      responses:
        "201": { description: Created topic { id, slug }. }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "500": { $ref: "#/components/responses/ServerError" }
  /admin/religious-topics/{id}:
    put:
      tags: [conversations]
      summary: Save a religious topic block and re-index it into religious_content.
      security: [{ portalSession: [] }, { adminKey: [] }]
      parameters: [{ $ref: "#/components/parameters/Id" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                content: { type: string }
                updated_by: { type: string }
      responses:
        "200": { description: Saved with chunk count. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "500": { $ref: "#/components/responses/ServerError" }
    delete:
      tags: [conversations]
      summary: Delete a religious topic block and its vectors.
      security: [{ portalSession: [] }, { adminKey: [] }]
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "200": { description: Deleted. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "500": { $ref: "#/components/responses/ServerError" }
  /admin/profile:
    put:
      tags: [users]
      summary: Update the signed-in user's own display name and/or password.
      description: Changing the password requires the correct current password. Identified by the user id in the body.
      security: [{ portalSession: [] }, { adminKey: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id]
              properties:
                id: { type: string, format: uuid }
                display_name: { type: string }
                current_password: { type: string }
                new_password: { type: string, minLength: 8 }
      responses:
        "200": { description: Updated profile. }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { description: Unauthorized or current password incorrect. }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/ServerError" }
  /admin/scrape:
    post:
      tags: [conversations]
      summary: Manually re-scrape and re-embed the official site content.
      description: Same work as the daily cron, triggered from the Prompt page, gated by the admin key.
      security: [{ portalSession: [] }, { adminKey: [] }]
      responses:
        "200": { description: Scrape stats (pages, chunks embedded/stored). }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "500": { $ref: "#/components/responses/ServerError" }
  /admin/analytics:
    get:
      tags: [conversations, tasks]
      summary: Leadership task and conversation analytics (rolling 30-day window).
      security: [{ portalSession: [] }, { adminKey: [] }]
      parameters:
        - name: department_id
          in: query
          schema: { type: string }
          description: Filter task metrics to one department, or `all`.
      responses:
        "200": { description: Task and conversation analytics. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/ServerError" }
  /users/me:
    get:
      tags: [users]
      summary: Resolve the current WhatsApp caller context.
      security: [{ whatsappPhone: [] }]
      responses:
        "200":
          description: Caller context.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CallerContext" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /users/resolve:
    get:
      tags: [users]
      summary: Resolve a transcript alias to a user.
      security: [{ whatsappPhone: [] }, { portalSession: [] }, { adminKey: [] }]
      parameters:
        - name: alias
          in: query
          required: true
          schema: { type: string }
      responses:
        "200": { description: Matching user, if any. }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "500": { $ref: "#/components/responses/ServerError" }
  /users/bulk-create:
    post:
      tags: [users, departments]
      summary: Bulk-create users detected from a transcript.
      security: [{ whatsappPhone: [] }, { portalSession: [] }, { adminKey: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BulkCreateUsersRequest" }
      responses:
        "201": { description: Created or updated users and memberships. }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/ServerError" }
  /departments:
    get:
      tags: [departments]
      summary: List departments visible to the caller.
      security: [{ whatsappPhone: [] }, { portalSession: [] }, { adminKey: [] }]
      responses:
        "200":
          description: Departments.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Department" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "500": { $ref: "#/components/responses/ServerError" }
    post:
      tags: [departments]
      summary: Create a department.
      security: [{ portalSession: [] }, { adminKey: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string }
                description: { type: [string, "null"] }
      responses:
        "201": { description: Created department. }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { description: Department already exists. }
        "500": { $ref: "#/components/responses/ServerError" }
  /departments/{id}:
    put:
      tags: [departments]
      summary: Update a department.
      security: [{ portalSession: [] }, { adminKey: [] }]
      parameters: [{ $ref: "#/components/parameters/Id" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                description: { type: [string, "null"] }
      responses:
        "200": { description: Updated department. }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/ServerError" }
    delete:
      tags: [departments]
      summary: Remove an unused department.
      description: Blocked if the department has members, tasks, or milestones.
      security: [{ portalSession: [] }, { adminKey: [] }]
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "200": { description: Deleted department. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { description: Department is still in use. }
        "500": { $ref: "#/components/responses/ServerError" }
  /departments/{id}/tasks:
    get:
      tags: [departments, tasks]
      summary: List tasks in one department.
      security: [{ whatsappPhone: [] }, { portalSession: [] }, { adminKey: [] }]
      parameters:
        - { $ref: "#/components/parameters/Id" }
        - { $ref: "#/components/parameters/StatusFilter" }
        - { $ref: "#/components/parameters/PriorityFilter" }
      responses:
        "200": { description: Tasks. }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/ServerError" }
  /departments/{id}/summary:
    get:
      tags: [departments, tasks]
      summary: Get task counts for one department.
      security: [{ whatsappPhone: [] }, { portalSession: [] }, { adminKey: [] }]
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "200": { description: Department summary. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/ServerError" }
  /departments/{id}/prompt-config:
    get:
      tags: [departments, transcripts]
      summary: Get transcript parser prompt configuration for a department.
      security: [{ whatsappPhone: [] }, { portalSession: [] }, { adminKey: [] }]
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "200":
          description: Prompt configuration.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DepartmentPromptConfig" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/ServerError" }
    put:
      tags: [departments, transcripts]
      summary: Save transcript parser prompt configuration for a department.
      security: [{ whatsappPhone: [] }, { portalSession: [] }, { adminKey: [] }]
      parameters: [{ $ref: "#/components/parameters/Id" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [flexible_prompt]
              properties:
                flexible_prompt: { type: string, maxLength: 4000 }
      responses:
        "200": { description: Saved prompt configuration. }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/ServerError" }
  /departments/summary/all:
    get:
      tags: [departments, tasks]
      summary: Get all department summaries and top blockers.
      security: [{ adminKey: [] }, { whatsappPhone: [] }]
      parameters:
        - name: filter
          in: query
          schema: { type: string, enum: [all, blocked, overdue, on_track], default: all }
      responses:
        "200":
          description: Department summaries.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/DepartmentSummary" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/ServerError" }
  /tasks:
    get:
      tags: [tasks]
      summary: List tasks scoped to the caller.
      description: Members see assigned tasks only. PM/HOD users see tasks in their active departments. Leadership/admin sees all tasks.
      security: [{ whatsappPhone: [] }, { portalSession: [] }, { adminKey: [] }]
      parameters:
        - { $ref: "#/components/parameters/StatusFilter" }
        - { $ref: "#/components/parameters/PriorityFilter" }
        - name: department_id
          in: query
          schema: { type: string, format: uuid }
        - name: assignee_id
          in: query
          schema: { type: string, format: uuid }
        - name: include_archived
          in: query
          schema: { type: boolean, default: false }
      responses:
        "200":
          description: Tasks.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/Task" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "500": { $ref: "#/components/responses/ServerError" }
    post:
      tags: [tasks]
      summary: Create a task.
      description: Creating an issue with a department notifies active department members marked contact_for_issues.
      security: [{ whatsappPhone: [] }, { portalSession: [] }, { adminKey: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateTaskRequest" }
      responses:
        "201": { description: Created task. }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/ServerError" }
  /tasks/kanban:
    get:
      tags: [tasks]
      summary: List tasks grouped for the kanban board.
      security: [{ whatsappPhone: [] }, { portalSession: [] }, { adminKey: [] }]
      parameters:
        - { $ref: "#/components/parameters/PriorityFilter" }
        - name: department_id
          in: query
          schema: { type: string, format: uuid }
        - name: assignee_id
          in: query
          schema: { type: string, format: uuid }
        - name: include_complete
          in: query
          schema: { type: boolean, default: false }
      responses:
        "200":
          description: Board grouped by status.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/KanbanBoard" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "500": { $ref: "#/components/responses/ServerError" }
  /tasks/{id}:
    get:
      tags: [tasks]
      summary: Get one task.
      security: [{ whatsappPhone: [] }, { portalSession: [] }, { adminKey: [] }]
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "200": { description: Task detail. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      tags: [tasks]
      summary: Update one task.
      description: Moving an issue to a department notifies active department members marked contact_for_issues.
      security: [{ whatsappPhone: [] }, { portalSession: [] }, { adminKey: [] }]
      parameters: [{ $ref: "#/components/parameters/Id" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateTaskRequest" }
      responses:
        "200": { description: Updated task. }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/ServerError" }
  /transcripts/upload:
    post:
      tags: [transcripts]
      summary: Upload and parse a WhatsApp or meeting transcript.
      security: [{ whatsappPhone: [] }, { portalSession: [] }, { adminKey: [] }]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
                department_id:
                  type: string
                  format: uuid
                  description: Backward-compatible single department/primary department.
                department_ids:
                  type: array
                  items: { type: string, format: uuid }
                  description: Departments to include in parser context. Multipart clients may send this as JSON.
                transcript_type: { type: string, enum: [whatsapp, meeting] }
      responses:
        "201":
          description: Parsed transcript upload with reviewable create/update proposals.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ParsedTranscript" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/ServerError" }
  /transcripts/{id}/events:
    get:
      tags: [transcripts]
      summary: List parsed events for an upload.
      security: [{ whatsappPhone: [] }, { portalSession: [] }, { adminKey: [] }]
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "200":
          description: Conversation events enriched with review action and existing-match metadata.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ConversationEvent" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/ServerError" }
  /transcripts/{id}/apply:
    post:
      tags: [transcripts, tasks]
      summary: Apply selected parsed events as tasks.
      security: [{ whatsappPhone: [] }, { portalSession: [] }, { adminKey: [] }]
      parameters: [{ $ref: "#/components/parameters/Id" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                event_ids:
                  type: array
                  items: { type: string, format: uuid }
                selected_events:
                  type: array
                  items: { $ref: "#/components/schemas/ApplyTranscriptEvent" }
      responses:
        "200": { description: Apply results. }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/ServerError" }
  /cron/scrape:
    get:
      tags: [cron]
      summary: Run site scrape cron.
      security: [{ cronSecret: [] }]
      responses:
        "200": { description: Scrape result. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "500": { $ref: "#/components/responses/ServerError" }
    post:
      tags: [cron]
      summary: Run site scrape cron.
      security: [{ cronSecret: [] }]
      responses:
        "200": { description: Scrape result. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "500": { $ref: "#/components/responses/ServerError" }
  /cron/daily-digest:
    get:
      tags: [cron, email, tasks]
      summary: Send daily prioritized task digest emails.
      description: Sends scoped open task summaries to users with active email digest preferences.
      security: [{ cronSecret: [] }]
      responses:
        "200":
          description: Digest result.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DailyDigestResult" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "500": { $ref: "#/components/responses/ServerError" }
    post:
      tags: [cron, email, tasks]
      summary: Send daily prioritized task digest emails.
      security: [{ cronSecret: [] }]
      responses:
        "200":
          description: Digest result.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DailyDigestResult" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "500": { $ref: "#/components/responses/ServerError" }
  /whatsapp/webhook:
    get:
      tags: [conversations]
      summary: Verify Meta WhatsApp webhook subscription.
      security: []
      responses:
        "200": { description: Challenge response. }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      tags: [conversations]
      summary: Receive inbound WhatsApp webhook messages.
      security: []
      responses:
        "200": { description: Webhook processed. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "500": { $ref: "#/components/responses/ServerError" }
  /relay-updates:
    get:
      tags: [conversations]
      summary: Public relay-center updates feed (CORS, cached).
      description: >-
        Returns all published relay updates newest-first. Served with
        `Access-Control-Allow-Origin: *` and `Cache-Control: public, s-maxage=60,
        stale-while-revalidate=300`. No authentication required.
      security: []
      responses:
        "200":
          description: Published updates, newest first.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/RelayUpdate" }
        "500": { $ref: "#/components/responses/ServerError" }
  /admin/relay-updates:
    get:
      tags: [conversations]
      summary: List all relay updates (published and unpublished).
      security: [{ portalSession: [] }, { adminKey: [] }]
      responses:
        "200":
          description: All relay updates, newest first.
          content:
            application/json:
              schema:
                type: object
                required: [updates]
                properties:
                  updates:
                    type: array
                    items: { $ref: "#/components/schemas/RelayUpdate" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/ServerError" }
    post:
      tags: [conversations]
      summary: Create a relay update and re-index published updates.
      description: Admin/leadership only. On success, re-indexes all published updates into site_content under `updates://relay`.
      security: [{ portalSession: [] }, { adminKey: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RelayUpdateWriteRequest" }
      responses:
        "200":
          description: Created update.
          content:
            application/json:
              schema:
                type: object
                required: [ok]
                properties:
                  ok: { type: boolean }
                  # Absent (not null) in the unlikely case the insert returns no row.
                  id: { type: string, format: uuid, nullable: true }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "500": { $ref: "#/components/responses/ServerError" }
  /admin/relay-updates/{id}:
    put:
      tags: [conversations]
      summary: Update a relay update and re-index published updates.
      description: Admin/leadership only. On success, re-indexes all published updates into site_content under `updates://relay`.
      security: [{ portalSession: [] }, { adminKey: [] }]
      parameters: [{ $ref: "#/components/parameters/Id" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RelayUpdateWriteRequest" }
      responses:
        "200":
          description: Updated update.
          content:
            application/json:
              schema:
                type: object
                required: [ok, id]
                properties:
                  ok: { type: boolean }
                  id: { type: string, format: uuid }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/ServerError" }
components:
  securitySchemes:
    whatsappPhone:
      type: apiKey
      in: header
      name: x-whatsapp-from
      description: E.164 phone number used by the WhatsApp agent and scoped user APIs.
    adminKey:
      type: apiKey
      in: header
      name: x-admin-key
      description: Server-to-server auth for agent tools and cron jobs. Never sent by browser clients.
    portalSession:
      type: apiKey
      in: cookie
      name: portal_session
      description: HMAC-SHA256-signed httpOnly session cookie set by POST /api/admin/auth. Carries { user_id, exp }. Used by all browser-facing admin routes.
    cronSecret:
      type: http
      scheme: bearer
      description: Cron bearer token derived from CRON_SECRET.
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    StatusFilter:
      name: status
      in: query
      schema: { type: string, enum: [open, in_progress, blocked, complete, all], default: all }
    PriorityFilter:
      name: priority
      in: query
      schema: { type: string, enum: [low, medium, high, all], default: all }
  responses:
    BadRequest:
      description: Invalid request.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Unauthorized:
      description: Missing or invalid authentication.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Forbidden:
      description: Caller lacks permission.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotFound:
      description: Resource not found.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    ServerError:
      description: Server error.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error: { type: string }
    TaskStatus:
      type: string
      enum: [open, in_progress, blocked, complete]
    TaskPriority:
      type: string
      enum: [low, medium, high]
    Department:
      type: object
      required: [id, name]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        description: { type: [string, "null"] }
        created_at: { type: string, format: date-time }
    User:
      type: object
      required: [id, phone_e164, role, global_role, status]
      properties:
        id: { type: string, format: uuid }
        display_name: { type: [string, "null"] }
        phone_e164: { type: string }
        email: { type: [string, "null"], format: email }
        role: { type: string, enum: [visitor, committee, admin] }
        global_role: { type: string, enum: [member, pm, hod, leadership_admin] }
        status: { type: string }
        transcript_aliases:
          type: array
          items: { type: string }
        email_digest: { type: boolean }
        department_membership_id: { type: [string, "null"], format: uuid }
        department_role: { type: [string, "null"], enum: [hod, pm, member, null] }
        contact_for_issues: { type: boolean }
    AuthSessionResponse:
      type: object
      required: [ok, token, user]
      properties:
        ok: { type: boolean }
        token: { type: string }
        user:
          type: object
          required: [id, is_support, is_manager, is_it]
          properties:
            id: { type: string, format: uuid }
            display_name: { type: [string, "null"] }
            email: { type: [string, "null"], format: email }
            role: { type: [string, "null"], enum: [visitor, committee, admin, null] }
            global_role: { type: [string, "null"], enum: [member, pm, hod, leadership_admin, null] }
            is_support: { type: boolean }
            is_manager: { type: boolean }
            is_it: { type: boolean }
    CallerContext:
      type: object
      required: [user_id, global_role, can_read_all, can_write_all, departments]
      properties:
        user_id: { type: string }
        display_name: { type: [string, "null"] }
        global_role: { type: string, enum: [member, pm, hod, leadership_admin] }
        can_read_all: { type: boolean }
        can_write_all: { type: boolean }
        departments:
          type: array
          items:
            type: object
            required: [department_id, department_name, dept_role]
            properties:
              department_id: { type: string, format: uuid }
              department_name: { type: string }
              dept_role: { type: string, enum: [hod, pm, member] }
    Task:
      type: object
      required: [id, title, status, priority, source, archived, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        description: { type: [string, "null"] }
        department_id: { type: [string, "null"], format: uuid }
        status: { $ref: "#/components/schemas/TaskStatus" }
        priority: { $ref: "#/components/schemas/TaskPriority" }
        archived: { type: boolean }
        assigned_to: { type: [string, "null"], format: uuid }
        created_by: { type: [string, "null"], format: uuid }
        source: { type: string, enum: [transcript, whatsapp_agent, manual] }
        due_date: { type: [string, "null"], format: date }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    CreateTaskRequest:
      type: object
      required: [title]
      properties:
        title: { type: string }
        department_id: { type: string, format: uuid }
        department_name: { type: string }
        description: { type: [string, "null"] }
        assigned_to: { type: [string, "null"], format: uuid }
        assigned_to_alias: { type: string }
        due_date: { type: [string, "null"], format: date }
        priority: { $ref: "#/components/schemas/TaskPriority" }
        source: { type: string, enum: [transcript, whatsapp_agent, manual] }
    UpdateTaskRequest:
      type: object
      properties:
        title: { type: string }
        description: { type: [string, "null"] }
        status: { $ref: "#/components/schemas/TaskStatus" }
        priority: { $ref: "#/components/schemas/TaskPriority" }
        department_id: { type: [string, "null"], format: uuid }
        assigned_to: { type: [string, "null"], format: uuid }
        assigned_to_alias: { type: string }
        due_date: { type: [string, "null"], format: date }
        archived: { type: boolean }
    KanbanBoard:
      type: object
      required: [open, in_progress, blocked, complete]
      properties:
        open:
          type: array
          items: { $ref: "#/components/schemas/Task" }
        in_progress:
          type: array
          items: { $ref: "#/components/schemas/Task" }
        blocked:
          type: array
          items: { $ref: "#/components/schemas/Task" }
        complete:
          type: array
          items: { $ref: "#/components/schemas/Task" }
    DepartmentSummary:
      type: object
      required: [department_name, department_id, open, in_progress, blocked, complete, total, overdue, top_blockers]
      properties:
        department_name: { type: string }
        department_id: { type: string, format: uuid }
        open: { type: integer }
        in_progress: { type: integer }
        blocked: { type: integer }
        complete: { type: integer }
        total: { type: integer }
        overdue: { type: integer }
        top_blockers:
          type: array
          items: { $ref: "#/components/schemas/Task" }
    ConversationUpload:
      type: object
      properties:
        id: { type: string, format: uuid }
        department_id: { type: string, format: uuid }
        filename: { type: [string, "null"] }
        group_name: { type: [string, "null"] }
        parsed_at: { type: [string, "null"], format: date-time }
        last_message_at: { type: [string, "null"], format: date-time }
        parsed_new_members:
          type: array
          items: { $ref: "#/components/schemas/ParsedNewMember" }
    ConversationEvent:
      type: object
      properties:
        id: { type: string, format: uuid }
        upload_id: { type: string, format: uuid }
        department_id: { type: string, format: uuid }
        event_type:
          type: string
          enum: [task_created, task_updated, task_completed, milestone_created, milestone_updated, issue_created, issue_updated, issue_resolved, decision, info]
        item_type: { type: string, enum: [task, issue, milestone] }
        task_id: { type: [string, "null"], format: uuid }
        milestone_id: { type: [string, "null"], format: uuid }
        review_action: { type: string, enum: [create, update] }
        review_kind: { type: string, enum: [task, issue, milestone] }
        target_id: { type: [string, "null"], format: uuid }
        target_title: { type: [string, "null"] }
        target_status: { type: [string, "null"] }
        review_label: { type: string }
        sender_alias: { type: [string, "null"] }
        message_text: { type: [string, "null"] }
        message_timestamp: { type: [string, "null"], format: date-time }
        ai_summary: { type: [string, "null"] }
        task_title: { type: [string, "null"] }
        milestone_title: { type: [string, "null"] }
        assigned_to_alias: { type: [string, "null"] }
        assigned_to_user_id: { type: [string, "null"], format: uuid }
        priority: { $ref: "#/components/schemas/TaskPriority" }
        confidence: { type: [number, "null"] }
        percent_complete: { type: [integer, "null"] }
        budget: { type: [number, "null"] }
        notes: { type: [string, "null"] }
        description: { type: [string, "null"] }
        suggested_status: { $ref: "#/components/schemas/TaskStatus" }
        due_date: { type: [string, "null"], format: date }
        source: { type: [string, "null"], enum: [call_transcript, whatsapp_agent, manual, transcript] }
        raw_function_event: { type: [object, "null"] }
        suggested_changes: { type: [object, "null"] }
        applied: { type: boolean }
    ParsedTranscript:
      type: object
      required: [events]
      properties:
        group_name: { type: [string, "null"] }
        last_message_at: { type: [string, "null"], format: date-time }
        departments:
          type: array
          items: { $ref: "#/components/schemas/Department" }
        existing_items:
          type: array
          items: { type: object }
        events:
          type: array
          items: { $ref: "#/components/schemas/ConversationEvent" }
        function_calls_saved: { type: integer }
        flexible_prompt: { type: string }
        transcript_type: { type: string, enum: [whatsapp, meeting] }
    ParsedNewMember:
      type: object
      required: [alias, context]
      properties:
        alias: { type: string }
        context: { type: string }
    DepartmentPromptConfig:
      type: object
      required: [fixed_prompt_locked, flexible_prompt]
      properties:
        fixed_prompt_locked: { type: boolean }
        flexible_prompt: { type: string }
        updated_at: { type: [string, "null"], format: date-time }
    ApplyTranscriptEvent:
      type: object
      required: [event_id]
      properties:
        event_id: { type: string, format: uuid }
        title: { type: string }
        description: { type: [string, "null"] }
        status: { $ref: "#/components/schemas/TaskStatus" }
        priority: { $ref: "#/components/schemas/TaskPriority" }
        due_date: { type: [string, "null"], format: date }
        budget: { type: [number, "null"] }
        percent_complete: { type: [number, "null"] }
        notes: { type: [string, "null"] }
        milestone_id: { type: [string, "null"], format: uuid }
        assigned_to_alias: { type: string }
        assigned_to_user_id: { type: [string, "null"], format: uuid }
    CreateUserRequest:
      type: object
      required: [display_name, phone_e164]
      properties:
        display_name: { type: string }
        phone_e164: { type: string }
        email: { type: [string, "null"], format: email }
        global_role: { type: string, enum: [member, pm, hod, leadership_admin] }
    UpdateUserRequest:
      type: object
      properties:
        display_name: { type: string }
        email: { type: [string, "null"], format: email }
        global_role: { type: string, enum: [member, pm, hod, leadership_admin] }
        status: { type: string }
    DepartmentMembershipRequest:
      type: object
      required: [department_id, dept_role]
      properties:
        department_id: { type: string, format: uuid }
        dept_role: { type: string, enum: [hod, pm, member] }
        is_active: { type: boolean }
        contact_for_issues: { type: boolean }
        send_welcome:
          type: boolean
          description: >-
            When true, issue a password setup link and send the new-user welcome notification
            (email + the `committee_platform_access_created` WhatsApp template). Welcomes each
            user only once: an already-welcomed user (non-null `welcomed_at`) returns
            `already_welcomed: true` and nothing is sent. When set, the response includes a
            `welcome_notification` object (see WelcomeNotification).
    WelcomeNotification:
      type: object
      description: >-
        Outcome of an onboarding welcome attempt. `already_welcomed` is true when the user had
        already been welcomed and the automatic path therefore sent nothing (the manual
        /welcome action forces a re-send and never short-circuits).
      properties:
        email: { type: string, enum: [sent, skipped, failed] }
        whatsapp: { type: string, enum: [sent, skipped, failed] }
        already_welcomed: { type: boolean }
        set_password_url: { type: string }
        errors:
          type: array
          items: { type: string }
    BulkCreateUsersRequest:
      type: object
      required: [members]
      properties:
        members:
          type: array
          items:
            type: object
            required: [display_name, phone_e164, department_id, dept_role]
            properties:
              display_name: { type: string }
              phone_e164: { type: string }
              email: { type: [string, "null"], format: email }
              department_id: { type: string, format: uuid }
              dept_role: { type: string, enum: [hod, pm, member] }
              transcript_aliases:
                type: array
                items: { type: string }
    DailyDigestResult:
      type: object
      required: [ok, sent, skipped, errors]
      properties:
        ok: { type: boolean }
        sent: { type: integer }
        skipped: { type: integer }
        errors:
          type: array
          items:
            type: object
            required: [user_id, message]
            properties:
              user_id: { type: string, format: uuid }
              message: { type: string }
    RelayUpdate:
      type: object
      required: [id, date, title, body, category, published]
      properties:
        id: { type: string, format: uuid }
        date: { type: string, format: date }
        title: { type: string, maxLength: 200 }
        body: { type: string, maxLength: 1000 }
        category: { type: string, enum: [urgent, schedule, travel, advisory] }
        link: { type: [string, "null"], maxLength: 500, description: Optional CTA URL (http/https). }
        cta: { type: [string, "null"], maxLength: 80, description: Optional CTA label; requires link. }
        published: { type: boolean }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    RelayUpdateWriteRequest:
      type: object
      required: [user_id, date, title, body, category]
      properties:
        user_id: { type: string, format: uuid, description: Acting admin user id; server verifies admin/leadership role. }
        date: { type: string, format: date }
        title: { type: string, maxLength: 200 }
        body: { type: string, maxLength: 1000 }
        category: { type: string, enum: [urgent, schedule, travel, advisory] }
        link: { type: string, maxLength: 500, description: Optional CTA URL (http/https). }
        cta: { type: string, maxLength: 80, description: Optional CTA label; requires link. }
        published: { type: boolean, default: true }
